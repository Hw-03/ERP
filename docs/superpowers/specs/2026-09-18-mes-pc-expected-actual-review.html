cted":"자신이 보낸 창고 이동 요청은 승인자가 대신 실행했더라도 요청자 본인이 올바른 PIN과 취소 사유를 입력하면 취소할 수 있어야 한다. 누가 요청·승인·취소했는지는 각각 남고 재고는 한 번만 원복돼야 한다.","actual":"E33이 자신이 보낸 완료 거래를 열어 PIN과 취소 사유를 입력했지만 `본인 작업 또는 결재 권한자만 취소할 수 있습니다.`라는 오류로 막혔다. 같은 거래를 관리자로 취소하니 재고는 정상적으로 원복됐다. 시스템이 요청자 E33이 아니라 승인하면서 실제 원장을 만든 E32를 `본인 작업자`로 판단하고 있었다.\n\n보완 브라우저 실측: 입출고 내역에서 기간·작업 유형·검색을 바꾸며 합계 카드와 목록을 대조했고, 추가 조회 뒤 기존 행과 선택 필터가 유지되는지 확인했다. 이번 실측으로 만든 창고 조정·원자재 입고·AS 사용과 각 취소 행을 상세까지 열어 정·역거래 연결, 전후 수량, 요청·승인·취소자를 확인했다. 주요 화면 이동 중 치명적 화면 오류는 없었고 콘솔에는 이미지 비율 경고가 반복됐다.","verdict":"DIFFERENCE","note":"P0 · 승인 요청자가 자신의 완료 거래를 취소할 수 없는 권한 회귀다."},{"id":"PC-DELTA-HISTORY-05","category":"입출고 내역","action":"구성품을 정상 재고로 되돌린 재작업 내역을 목록·펼침 행·상세 패널에서 차례로 비교한다.","expected":"재작업으로 불량품을 사용하고 구성품을 정상 재고로 되돌렸다면, 목록만 봐도 불량 재고가 몇 개 줄고 각 구성품 재고가 몇 개 늘었는지 알 수 있어야 한다. 목록을 펼쳤을 때와 오른쪽 상세를 열었을 때도 같은 수량이 보여야 한다.","actual":"2026년 9월 14일 08시 41분 COCOON BOTTOM BODY ASS'Y 재작업은 목록에 `재고 변동 없음`으로 표시됐다. 그러나 같은 행을 펼치자 구성품 3종이 조립 재고에 각각 1개씩 늘어난 내용이 보였고, 오른쪽 상세에는 `조립 재고 3품목 +3`, `불량 재고 1품목 -1`이 표시됐다. 실제 재고는 바뀌었지만 목록의 대표 문구만 반대로 안내하고 있었다.","verdict":"DIFFERENCE","note":"목록 대표 행이 재작업의 불량 차감과 구성품 증가를 합쳐 실제 변동으로 표시해야 한다."},{"id":"PC-DELTA-MAP-01","category":"창고 지도","action":"검색, 위치·박스·특수구역 상세, 미배치·정합성, 전체화면, 단축키와 Escape를 사용한다.","expected":"창고 지도에서 특정 앵글과 검색어를 보고 전체화면으로 전환했다가 나와도 보고 있던 위치와 검색 내용이 그대로 남아야 한다. 없는 품목은 오류가 아니라 찾을 수 없다는 안내로 구분돼야 한다.","actual":"없는 품목을 검색했을 때 위치를 찾을 수 없다는 안내는 정상적으로 나왔다. 하지만 앵글 1을 연 상태에서 전체화면을 켜자 창고 전체 평면도로 돌아갔고, 전체화면에서 나온 뒤에도 앵글 선택과 검색어가 모두 사라졌다.","verdict":"DIFFERENCE","note":"P2 · 전체화면 전환이 현재 선택한 앵글과 검색 상태를 잃는다."},{"id":"PC-DELTA-MAP-02","category":"창고 지도","action":"일반 사용자와 창고 결재자가 편집을 시작하고 reconcile 조회를 실패시킨다.","expected":"창고 지도 편집은 권한 있는 담당자가 본인 확인을 마친 뒤에만 시작돼야 한다. 일반 직원은 편집할 수 없어야 하며, 저장 중 오류가 나면 이전 지도를 유지한 채 다시 시도할 수 있어야 한다.","actual":"본인 확인 전에는 편집 시작 버튼을 누를 수 없었고, 권한 있는 관리자가 본인 확인을 마치자 박스 관리와 구조 편집, 앵글·통로·PL 추가 기능이 나타났다. 보기 모드로도 정상 복귀했다. 일반 직원 차단과 저장 실패 뒤 재시도는 아직 확인하지 않았다.\n\n보완 브라우저 실측: 창고 지도 권한과 PIN을 확인한 뒤 QA-PC-AUDIT-A  실측: 창고 지도 권한과 PIN을 확인한 뒤 QA-PC-AUDIT-A10 앵글을 생성·3x2로 수정하고, 34-HR-0001 중형 박스를 자리1에 1개 배치·2개로 수정·자리2로 드래그 이동했다. 이어 QA-PC-AUDIT-PASSAGE-01 통로 2x2와 QA-PC-AUDIT-PL-02 2x2를 생성·수정했다. 화면의 배치 대조는 34-HR-0001 2\/628로 즉시 갱신됐다.","verdict":"DIFFERENCE","note":"P0 · 구조 드래그 저장 실패 시 화면과 서버 구조가 달라질 수 있다."},{"id":"PC-DELTA-DEFECTORDER-01","category":"불량","action":"불량 품목 선택 순서를 편집·저장·초기화하고 다른 직원과 교차 확인한다.","expected":"본인의 유효 품목 순서만 영속하고, 다른 직원 순서와 격리 업무 결과에는 영향을 주지 않아야 합니다.","actual":"불량 화면도 같은 직원 품목 순서 API를 쓰므로 다른 직원의 순서를 바꿀 수 있는 권한 공백을 공유합니다.\n\n보완 브라우저 실측: 불량 화면에서 8-TR-0002 튜브 정상 4·불량 26 중 1개를 실제 격리해 3·27로 만들고 정상 복귀로 4·26을 복원했다. 분류 변경·폐기·재작업·공급처 반품의 개별\/일괄 패널, 원건 선택 제한, 합계, 사유 분류와 자유 메모, 통계의 부서·기간 필터를 확인했으며 내역 목록·상세의 불량\/폐기\/반품\/취소 라벨과 불량 위치 효과를 대조했다.","verdict":"DIFFERENCE","note":"P0 · 다른 직원의 불량 업무 후보 우선순위도 변경될 수 있다."},{"id":"PC-DELTA-DEFECT-01","category":"불량","action":"창고 정상 재고에서 품목을 일부 격리한 뒤 같은 격리 원건의 일부를 정상 복귀하고 창고·부서·불량 재고와 입출고 내역을 비교한다.","expected":"창고 재고 20개에서 2개를 격리하면 창고 정상 재고는 18개가 된다. 그중 1개를 정상 복귀하면 원래 있던 창고 정상 재고가 19개로 돌아와야 한다. 입출고 내역도 창고 18→19와 불량 2→1이라고 보여야 한다.","actual":"창고 재고 20개에서 2개를 격리했을 때는 창고가 18개로 정확히 줄었다. 하지만 1개를 정상 복귀한 뒤에도 실제 창고 수량은 18개 그대로였다. 대신 시스템이 `창고`라는 이름의 별도 부서 정상 위치를 새로 만들고 거기에 1개를 넣었다. 입출고 내역은 이 별도 위치를 `창고 재고 0→1`이라고 표시해, 직원이 실제 창고 수량이 19개로 돌아온 것으로 오해할 수 있다.","verdict":"DIFFERENCE","note":"P0 · 재고 총량 20개는 보존되지만 원래 출처가 바뀌어 실제 창고 가용 수량과 화면 표시가 틀어진다. 격리 원건에 원래 출처 종류를 보존하고 복귀 시 그 위치로 되돌려야 한다."},{"id":"PC-DELTA-DEFECT-02","category":"불량","action":"B급 또는 구형 보관품을 정상 복귀한 직후 같은 목록의 건수와 해당 품목 노출을 확인하고 수동 동기화 전후를 비교한다.","expected":"B급 품목 정상 복귀가 끝났다는 안내가 뜨면 처리한 품목은 목록에서 바로 사라지고 전체 보관 건수와 B급 건수도 각각 1건 줄어야 한다. 직원이 다시 동기화 버튼을 누를 필요가 없어야 한다.","actual":"QA 품목 1개를 정상 복귀해 DB의 남은 수량은 0이 됐고 화면에도 `정상 복귀 완료`가 떴다. 그런데 같은 B급 목록은 여전히 전체 20건·B급 12건과 QA 품목 1개를 보여 줬다. 상단 동기화 버튼을 누른 뒤에야 전체 19건·B급 11건으로 바뀌고 QA 품목이 사라졌다.","verdict":"DIFFERENCE","note":"P1 · 완료 직후 서버 재조회가 최신 목록을 반영하도록 고치고, 처리된 품목을 다시 누르지 못하게 해야 한다."},{"id":"PC-DELTA-ADMIN-01","category":"관리자","action":"임시 모델·품목·직원·부서·BOM을 생성·변경하고 소비 화면과 과거 이력을 대조한다.","expected":"활성 기준정보 변경은 후보·필터·승인 라우팅에 바로 반영하고 과거 거래는 보존하며, 의존 데이터 삭제는 막아야 합니다.","actual":"활성 상태는 현재 후보와 라우팅에 반영되지만, 품목·부서의 일부 삭제 경로는 의존 데이터를 함께 제거하거나 충분히 막지 않습니다.\n\n보완 브라우저 실측: 관리자에서 QA 모델 생성·기호 5자 제한·이름\/기호 수정, QA 부서 생성·색상 수정·비활성\/재활성, QA 품목 두 건 생성(초기 창고 재고 2와 0)·코드 QA01-TR-0026\/QA01-AA-0090·구매\/재고 기준 수정, QA BOM 자식 1건 추가·수량 2→3·완료→해제→재완료·사용처 1건을 실제 저장했다. 직원 권한·탭 저장과 재로그인 반영, PIN 초기화\/관리자 PIN 변경 입력 검증, 정합성 0건과 내보내기 화면도 확인했다.","verdict":"DIFFERENCE","note":"P0 · 과거·진행 업무가 참조하는 기준정보의 삭제 방어를 보강해야 한다."},{"id":"PC-DELTA-ADMIN-02","category":"관리자","action":"일반 부서 직원을 신규 등록할 때 기본으로 선택되는 PC 메뉴 권한을 확인한다.","expected":"튜브나 고압 같은 일반 부서 직원을 새로 만들 때는 그 직원이 실제로 볼 수 있는 메뉴와 관리자 화면의 기본 체크 상태가 서로 맞아야 한다. 관리자 메뉴는 관리 권한이 있는 직원에게만 선택할 수 있거나, 역할 때문에 자동 차단된다는 점을 알려줘야 한다.","actual":"튜브 직원과 고압 직원을 새로 만드는 화면에서는 관리자 메뉴를 포함한 모든 사이드바 메뉴가 처음부터 선택돼 있었다. 하지만 저장한 두 일반 직원으로 로그인하니 관리자 메뉴는 실제 화면에 나타나지 않았다. 보안 우회는 없지만, 관리자 입장에서는 체크된 메뉴가 직원에게 보일 것처럼 보여 설정 결과를 오해할 수 있다.","verdict":"DIFFERENCE","note":"P2 · 실제 권한 우회는 없지만 설정 화면의 선택값과 직원에게 보이는 결과가 달라 관리자 혼란을 유발한다."},{"id":"PC-DELTA-ADMIN-03","category":"관리자","action":"검수용 품목에 공급업체, 공급업체 품목코드, 기준 단가, 안전재고, 재주문점, 조달기간, 최소주문수량과 메모를 입력하고 저장·새로고침 후 다시 연다.","expected":"품목에 입력한 공급업체와 구매 기준은 저장 뒤 화면을 새로 열어도 그대로 보여야 한다. 이 정보를 수정했다고 품목 수량이나 다른 품목 정보가 바뀌면 안 된다.","actual":"검수 품목에 공급업체 `QA-PC-AUDIT-SUPPLIER`, 공급업체 코드 `QA-151013`, 기준 단가 1,234원, 안전재고 5개, 재주문점 10개, 조달기간 3일, 최소주문수량 2개와 구매 메모를 저장했다. 화면을 새로고침하고 관리자 인증을 다시 한 뒤 같은 품목을 열었을 때 모든 값이 그대로 표시됐고 재고는 20개로 유지됐다.","verdict":"PASS","note":"단가의 DB 원시값은 정확한 금액 계산을 위해 센트 단위로 저장되고 화면에서 1234.00으로 정상 환산됐다. 이는 결함이 아니다."},{"id":"PC-DELTA-ADMIN-04","category":"관리자","action":"로그인한 관리자가 품목을 생성·수정한 뒤 관리자 감사 기록에서 실제 작업자 사번을 확인한다.","expected":"관리자 기록을 보면 관리자 PIN을 사용했다는 사실과 함께 실제로 작업한 직원의 사번도 보여야 한다. 그래야 누가 품목을 만들고 수정했는지 나중에 확인할 수 있다.","actual":"관리자 E31로 검수 품목을 만들고 구매 기준을 수정했다. 두 작업 모두 관리자 감사 기록에는 `admin` 권한을 사용했다는 값과 변경 내용은 남았지만 실제 작업자 사번 칸은 비어 있었다. 같은 현상은 최근 직원 생성·수정과 기존 품목 수정·삭제 기록에서도 반복됐다.\n\n보완 브라우저 실측: 관리자에서 QA 모델 생성·기호 5자 제한·이름\/기호 수정, QA 부서 생성·색상 수정·비활성\/재활성, QA 품목 두 건 생성(초기 창고 재고 2와 0)·코드 QA01-TR-0026\/QA01-AA-0090·구매\/재고 기준 수정, QA BOM 자식 1건 추가·수량 2→3·완료→해제→재완료·사용처 1건을 실제 저장했다. 직원 권한·탭 저장과 재로그인 반영, PIN 초기화\/관리자 PIN 변경 입력 검증, 정합성 0건과 내보내기 화면도 확인했다.","verdict":"DIFFERENCE","note":"P0 · 관리자 PIN은 사람을 식별하지 않는다. 로그인한 직원 사번을 서버에서 검증해 모든 관리자 변경 기록에 함께 저장해야 한다."},{"id":"PC-DELTA-ADMIN-05","category":"관리자","action":"초기 창고 수량을 넣어 품목을 생성한 뒤 재고, 입출고 내역, 거래 원장과 관리자 감사 기록을 대조한다.","expected":"초기 수량 20개로 품목을 만들면 창고 재고가 0개에서 20개로 늘어난 거래가 입출고 내역에 보여야 한다. 상세에서는 작업 전 0개, 작업 후 20개, 위치 창고, 작업자 관리자와 등록 시각을 확인할 수 있어야 한다.","actual":"검수 품목을 초기 창고 수량 20개로 만들자 실제 창고 재고는 바로 20개가 됐다. 그러나 이 품목의 입출고 거래 원장은 한 건도 생기지 않았고 입출고 내역에도 초기 재고 20개가 들어온 기록이 없었다. 관리자 감사 기록에는 `초기 20, 창고 20`이라는 요약만 남아 재고 전후값과 정식 거래 번호로 추적할 수 없었다.\n\n보완 브라우저 실측: 관리자에서 QA 모델 생성·기호 5자 제한·이름\/기호 수정, QA 부서 생성·색상 수정·비활성\/재활성, QA 품목 두 건 생성(초기 창고 재고 2와 0)·코드 QA01-TR-0026\/QA01-AA-0090·구매\/재고 기준 수정, QA BOM 자식 1건 추가·수량 2→3·완료→해제→재완료·사용처 1건을 실제 저장했다. 직원 권한·탭 저장과 재로그인 반영, PIN 초기화\/관리자 PIN 변경 입력 검증, 정합성 0건과 내보내기 화면도 확인했다.","verdict":"DIFFERENCE","note":"P0 · 재고가 생겼는데 정식 거래 원장이 없어 위치별 전후 수량과 작업자를 끝까지 추적할 수 없다."},{"id":"PC-DELTA-ADMINAUDIT-01","category":"관리자","action":"현재 브라우저 단말 UUID에 표시명을 생성하고 다시 수정한다.","expected":"관리자가 현재 PC의 감사 단말 이름을 저장하면 정상 등록돼야 한다. 예전에 저장된 단말 정보가 오래된 형식이어도 자동으로 고치거나, 직원이 이해할 수 있는 안내와 해결 방법을 보여줘야 한다.","actual":"단말 이름을 저장하자 등록에 실패했고, UUID나 그룹 수처럼 일반 직원이 이해하기 어려운 내부 검증 문장이 그대로 화면에 나타났다. 화면에서 단말 정보를 초기화하거나 다시 발급받는 방법도 찾을 수 없었다.","verdict":"DIFFERENCE","note":"P1 · 레거시 단말 ID 마이그레이션과 사용자용 오류 변환이 필요하다."},{"id":"PC-DELTA-SESSION-01","category":"세션","action":"두 탭에서 같은 사용자로 로그인하고 한 탭 로그아웃, 다른 세션의 직원 비활성·역할 회수를 수행한다.","expected":"로그아웃 범위는 계약대로 동작하고, 비활성·권한 회수는 다른 열린 탭도 포커스 복귀 또는 다음 쓰기에서 즉시 막아야 합니다.","actual":"로그아웃은 현재 탭의 sessionStorage만 지우며 다른 탭에 알리지 않고, 권한 회수의 탭 간 즉시 차단 신호도 없습니다.\n\n보완 브라우저 실측: 두 번째 인앱 탭에서 로그아웃을 확인하자 그 탭만 직원 선택 화면으로 돌아갔고, 주 탭은 유승범 로그인과 설정 화면을 그대로 유지했다.","verdict":"DIFFERENCE","note":"P0 · 열린 다른 탭이 로그아웃 또는 권한 회수를 즉시 알지 못한다."},{"id":"PC-DELTA-CONSOLE-01","category":"품질","action":"모든 상위 탭과 상세·modal·상태 전이를 순회하며 콘솔과 React 오류 오버레이를 기록한다.","expected":"대시보드와 주요 업무 화면을 이동할 때 화면이 깨지거나 오류가 뜨지 않아야 하며, 개발자 도구에도 반복 경고가 남지 않아야 한다.","actual":"업무를 막는 오류나 빨간 오류 화면은 없었다. 다만 대시보드를 열 때 일부 품목 이미지의 가로세로 비율이 맞지 않는다는 경고가 개발자 도구에 반복해서 남았다. 2026-09-18 ChatGPT 인앱 브라우저에서 관리자 8개 화면과 알림·설정을 순회하고 설정을 취소·복구·새로고침한 동안에는 관리자 화면에서 새 경고나 오류가 추가되지 않았다.\n\n보완 브라우저 실측: 입출고 내역에서 기간·작업 유형·검색을 바꾸며 합계 카드와 목록을 대조했고, 추가 조회 뒤 기존 행과 선택 필터가 유지되는지 확인했다. 이번 실측으로 만든 창고 조정·원자재 입고·AS 사용과 각 취소 행을 상세까지 열어 정·역거래 연결, 전후 수량, 요청·승인·취소자를 확인했다. 주요 화면 이동 중 치명적 화면 오류는 없었고 콘솔에는 이미지 비율 경고가 반복됐다.","verdict":"DIFFERENCE","note":"업무 진행을 차단하지 않는 P2 시각·콘솔 품질 차이. 수정 여부는 전수 판정 후 사용자 확정 대상이다."},{"id":"PC-DELTA-DEFECT-03","category":"불량","action":"격리 등록 또는 바로 처리에서 품목·수량·사유를 입력한 뒤 사이드바, 브라우저 뒤로가기, 새로고침으로 이탈하고 계속 머무르기와 나가기를 각각 확인한다.","expected":"불량 처리에서 품목과 수량, 사유를 입력한 뒤 다른 메뉴로 이동하면 작성 내용이 사라질 수 있다는 경고가 떠야 한다. 계속 머무르기를 고르면 입력이 유지되고, 나가기를 고르면 서버에 불량 처리나 재고 거래가 생기지 않아야 한다.","actual":"전극(70kV) 1개를 장바구니에 담고 외관 불량 사유까지 선택한 뒤 입출고 내역을 눌렀지만 경고 없이 곧바로 화면이 바뀌었다. 다시 돌아왔을 때 작성 중이던 장바구니와 사유는 없어졌다. 제출 버튼은 누르지 않았으므로 불량 처리나 재고 거래는 만들어지지 않았다.","verdict":"DIFFERENCE","note":"P1 · 품목과 사유를 입력해도 사이드바 이동 시 경고 없이 작성 내용이 사라지는 현상을 실제 화면에서 확인했다."},{"id":"PC-DELTA-DEFECT-04","category":"불량","action":"BOM 상위품의 하위 품목을 정상·격리·폐기로 배분한 뒤 즉시 재작업 최종 확인창을 열어 실제 생성·격리·폐기될 하위 품목과 수량을 대조한다.","expected":"재작업을 최종 실행하기 전에는 어떤 상위품이 줄고 어떤 하위품이 정상·격리·폐기로 몇 개씩 처리되는지 한 번에 확인할 수 있어야 한다.","actual":"BOM 화면에서는 하위 4품목이 각각 정상 1개로 배분된 것을 확인할 수 있었다. 하지만 `즉시 재작업` 확인창에는 상위품 ADX4000W 20cm CONE ASS'Y, 수량 1, 조립만 표시됐고 하위 4품목과 배분 결과는 모두 빠졌다. 실행은 취소했다.","verdict":"DIFFERENCE","note":"P1 · 여러 하위 재고가 한 번에 바뀌는 작업에서 최종 결과를 확인할 수 없다."}]}</script>
  <script>
    "use strict";
    const MODEL = JSON.parse(document.getElementById("review-data").textContent);
    const VALID_IDS = MODEL.items.map(function (item) { return item.id; });
    const STORAGE_KEY = "dexcowin-mes-pc-review-v2:" + MODEL.auditRunId;
    const normalizeReviewExport = function normalizeReviewExport(payload, expectedRunId, validIds) {
  if (!payload || typeof payload !== "object" || Array.isArray(payload)) {
    throw new Error("검토 결과 JSON 객체가 아닙니다.");
  }
  if (payload.schemaVersion !== 2) {
    throw new Error("지원하지 않는 schemaVersion입니다.");
  }
  if (payload.auditRunId !== expectedRunId) {
    throw new Error(`실행 ID가 다릅니다. 현재: ${expectedRunId}, 파일: ${payload.auditRunId ?? "없음"}`);
  }
  if (!payload.reviews || typeof payload.reviews !== "object" || Array.isArray(payload.reviews)) {
    throw new Error("reviews 객체가 없습니다.");
  }

  const allowedIds = new Set(validIds);
  const allowedVerdicts = new Set(["approved", "revision", "hold"]);
  const normalized = {};
  for (const [id, review] of Object.entries(payload.reviews)) {
    if (!allowedIds.has(id)) {
      throw new Error(`현재 원장에 없는 항목 ID입니다: ${id}`);
    }
    if (!review || typeof review !== "object" || !allowedVerdicts.has(review.verdict)) {
      throw new Error(`${id}: 올바르지 않은 판정 값입니다.`);
    }
    normalized[id] = {
      verdict: review.verdict,
      note: typeof review.note === "string" ? review.note : "",
      updatedAt: typeof review.updatedAt === "string" ? review.updatedAt : new Date().toISOString(),
    };
  }
  return normalized;
};
    const state = { search: "", category: "", scope: "difference", unreviewedOnly: true };
    let reviews = {};

    const cards = document.getElementById("cards");
    const search = document.getElementById("search");
    const category = document.getElementById("category");
    const unreviewedOnly = document.getElementById("unreviewedOnly");
    const summary = document.getElementById("summary");
    const statusMessage = document.getElementById("statusMessage");

    function reviewPayload() {
      return { schemaVersion: 2, auditRunId: MODEL.auditRunId, exportedAt: new Date().toISOString(), reviews: reviews };
    }

    function setStatus(message, kind) {
      statusMessage.textContent = message || "";
      statusMessage.dataset.kind = kind || "";
    }

    function saveReviews() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(reviewPayload()));
        setStatus("자동 저장됨", "success");
      } catch (error) {
        setStatus("자동 저장 실패: " + error.message, "error");
      }
    }

    function loadReviews() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      try {
        reviews = normalizeReviewExport(JSON.parse(raw), MODEL.auditRunId, VALID_IDS);
      } catch (error) {
        reviews = {};
        setStatus("저장된 검토 결과를 읽지 못했습니다: " + error.message, "error");
      }
    }

    function isReviewed(id) {
      const review = reviews[id];
      if (!review) return false;
      return review.verdict !== "revision" || review.note.trim().length > 0;
    }

    function filteredItems() {
      const needle = state.search.trim().toLocaleLowerCase("ko-KR");
      return MODEL.items.filter(function (item) {
        if (state.category && item.category !== state.category) return false;
        if (state.scope === "difference" && item.verdict !== "DIFFERENCE") return false;
        if (state.scope === "pass" && item.verdict !== "PASS") return false;
        if (state.unreviewedOnly && isReviewed(item.id)) return false;
        if (!needle) return true;
        return [item.id, item.category, item.action, item.expected, item.actual, item.note]
          .join(" ").toLocaleLowerCase("ko-KR").includes(needle);
      });
    }

    function make(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function updateSummary(visibleCount) {
      const reviewedCount = MODEL.items.filter(function (item) { return isReviewed(item.id); }).length;
      summary.textContent = "표시 " + visibleCount + "개 / 전체 " + MODEL.items.length + "개 · 검토 완료 " + reviewedCount + "개";
    }

    function syncReviewUi(card, id) {
      const review = reviews[id];
      card.querySelectorAll("[data-verdict]").forEach(function (button) {
        button.dataset.selected = String(Boolean(review && review.verdict === button.dataset.verdict));
        button.setAttribute("aria-pressed", button.dataset.selected);
      });
      const noteWrap = card.querySelector(".note-wrap");
      const textarea = card.querySelector("textarea");
      const showNote = Boolean(review && (review.verdict === "revision" || review.verdict === "hold"));
      noteWrap.hidden = !showNote;
      textarea.required = Boolean(review && review.verdict === "revision");
      const help = card.querySelector(".note-help");
      help.textContent = textarea.required && textarea.value.trim() === ""
        ? "기대값 수정 내용을 입력해야 검토 완료로 집계됩니다."
        : "의견은 이 실행의 검토 결과에만 저장됩니다.";
      help.classList.toggle("error", textarea.required && textarea.value.trim() === "");
    }

    function buildCard(item) {
      const card = make("article", "card");
      card.id = "item-" + item.id.replace(/[^a-zA-Z0-9_-]/g, "-");
      card.dataset.itemId = item.id;

      const head = make("header", "card-head");
      const titleBox = make("div");
      const identity = make("div", "identity");
      identity.append(make("span", "id", item.id), make("span", "category", item.category));
      titleBox.append(identity, make("h2", "action", item.action));
      const systemVerdict = make("span", "system-verdict " + item.verdict.toLowerCase(), item.verdict);
      head.append(titleBox, systemVerdict);

      const comparison = make("div", "comparison");
      [["기대 동작", item.expected], ["실제 동작", item.actual]].forEach(function (content) {
        const pane = make("section", "pane");
        pane.append(make("h3", "pane-label", content[0]), make("p", "pane-text", content[1]));
        comparison.append(pane);
      });

      card.append(head, comparison);
      if (item.verdict === "DIFFERENCE" && item.note) {
        const differenceNote = make("p", "difference-note");
        differenceNote.append(make("strong", "", "차이 요약"), document.createTextNode(item.note));
        card.append(differenceNote);
      }

      const reviewSection = make("section", "review");
      reviewSection.append(make("p", "review-label", "내 검토 판정"));
      const verdicts = make("div", "verdicts");
      [["approved", "기대값 맞음"], ["revision", "기대값 수정"], ["hold", "보류"]].forEach(function (choice) {
        const button = make("button", "verdict-button", choice[1]);
        button.type = "button";
        button.dataset.verdict = choice[0];
        button.dataset.selected = "false";
        button.setAttribute("aria-pressed", "false");
        button.addEventListener("click", function () {
          const previousNote = reviews[item.id] ? reviews[item.id].note : "";
          reviews[item.id] = { verdict: choice[0], note: previousNote, updatedAt: new Date().toISOString() };
          saveReviews();
          syncReviewUi(card, item.id);
          updateSummary(filteredItems().length);
          if (choice[0] === "revision" || choice[0] === "hold") textarea.focus();
        });
        verdicts.append(button);
      });

      const noteWrap = make("div", "note-wrap");
      noteWrap.hidden = true;
      const noteLabel = make("label", "sr-only", "검토 의견");
      const textarea = make("textarea");
      textarea.placeholder = "수정할 기대값 또는 보류 사유를 적어 주세요.";
      textarea.value = reviews[item.id] ? reviews[item.id].note : "";
      noteLabel.htmlFor = "note-" + card.id;
      textarea.id = "note-" + card.id;
      textarea.addEventListener("input", function () {
        if (!reviews[item.id]) return;
        reviews[item.id].note = textarea.value;
        reviews[item.id].updatedAt = new Date().toISOString();
        saveReviews();
        syncReviewUi(card, item.id);
        updateSummary(filteredItems().length);
      });
      noteWrap.append(noteLabel, textarea, make("p", "note-help", "의견은 이 실행의 검토 결과에만 저장됩니다."));
      reviewSection.append(verdicts, noteWrap);
      card.append(reviewSection);
      syncReviewUi(card, item.id);
      return card;
    }

    function render() {
      const items = filteredItems();
      cards.replaceChildren();
      if (items.length === 0) {
        cards.append(make("div", "empty", "현재 조건에 맞는 검토 항목이 없습니다."));
      } else {
        const fragment = document.createDocumentFragment();
        items.forEach(function (item) { fragment.append(buildCard(item)); });
        cards.append(fragment);
      }
      updateSummary(items.length);
    }

    function initializeCategories() {
      Array.from(new Set(MODEL.items.map(function (item) { return item.category; })))
        .sort(function (a, b) { return a.localeCompare(b, "ko"); })
        .forEach(function (value) {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = value;
          category.append(option);
        });
    }

    search.addEventListener("input", function () { state.search = search.value; render(); });
    category.addEventListener("change", function () { state.category = category.value; render(); });
    unreviewedOnly.addEventListener("change", function () { state.unreviewedOnly = unreviewedOnly.checked; render(); });
    document.querySelectorAll("[data-scope]").forEach(function (button) {
      button.addEventListener("click", function () {
        state.scope = button.dataset.scope;
        document.querySelectorAll("[data-scope]").forEach(function (candidate) {
          candidate.setAttribute("aria-pressed", String(candidate === button));
        });
        render();
      });
    });
    document.getElementById("nextUnreviewed").addEventListener("click", function () {
      const next = filteredItems().find(function (item) { return !isReviewed(item.id); });
      if (!next) {
        setStatus("현재 조건에 미검토 항목이 없습니다.", "success");
        return;
      }
      const target = document.getElementById("item-" + next.id.replace(/[^a-zA-Z0-9_-]/g, "-"));
      if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "start" });
        target.querySelector(".verdict-button").focus({ preventScroll: true });
      }
    });
    document.getElementById("exportButton").addEventListener("click", function () {
      const blob = new Blob([JSON.stringify(reviewPayload(), null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = MODEL.auditRunId + "-expected-actual-reviews.json";
      link.click();
      URL.revokeObjectURL(link.href);
      setStatus("검토 결과 JSON을 저장했습니다.", "success");
    });
    document.getElementById("importButton").addEventListener("click", function () { document.getElementById("importFile").click(); });
    document.getElementById("importFile").addEventListener("change", async function (event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      try {
        reviews = normalizeReviewExport(JSON.parse(await file.text()), MODEL.auditRunId, VALID_IDS);
        saveReviews();
        render();
        setStatus("검토 결과를 불러왔습니다.", "success");
      } catch (error) {
        setStatus("불러오기 실패: " + error.message, "error");
      } finally {
        event.target.value = "";
      }
    });

    document.getElementById("runLabel").textContent = "실행 ID · " + MODEL.auditRunId;
    initializeCategories();
    loadReviews();
    render();
  </script>
</body>
</html>
