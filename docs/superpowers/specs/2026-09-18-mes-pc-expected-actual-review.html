<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DEXCOWIN MES 기대·실제 동작 검토</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef4f8;
      --surface: #ffffff;
      --surface-muted: #f7fafc;
      --text: #162536;
      --muted: #647487;
      --line: #d9e3ec;
      --blue: #1769e0;
      --blue-soft: #eaf2ff;
      --green: #127a53;
      --green-soft: #e7f7f0;
      --amber: #9a5b00;
      --amber-soft: #fff4d9;
      --red: #b42318;
      --red-soft: #feebe9;
      --shadow: 0 14px 40px rgba(42, 73, 102, .10);
      --radius: 20px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #101820;
        --surface: #17222d;
        --surface-muted: #1d2a36;
        --text: #edf4fa;
        --muted: #aab9c7;
        --line: #324352;
        --blue: #75a9ff;
        --blue-soft: #213b60;
        --green: #68d3a6;
        --green-soft: #173e32;
        --amber: #ffca67;
        --amber-soft: #463719;
        --red: #ff9187;
        --red-soft: #4e2727;
        --shadow: 0 16px 44px rgba(0, 0, 0, .28);
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.65;
    }
    button, input, select, textarea { font: inherit; }
    button, select, input[type="search"] { min-height: 44px; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--blue) 35%, transparent);
      outline-offset: 2px;
    }
    .page { width: min(1440px, calc(100% - 40px)); margin: 0 auto; padding: 32px 0 64px; }
    .hero {
      display: flex;
      justify-content: space-between;
      gap: 28px;
      align-items: flex-end;
      margin-bottom: 20px;
    }
    .eyebrow { margin: 0 0 4px; color: var(--blue); font-weight: 800; letter-spacing: .04em; }
    h1 { margin: 0; font-size: clamp(26px, 3vw, 40px); line-height: 1.2; letter-spacing: -.035em; }
    .subtitle { margin: 8px 0 0; color: var(--muted); }
    .run { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .toolbar {
      position: sticky;
      top: 12px;
      z-index: 5;
      display: grid;
      gap: 12px;
      padding: 16px;
      margin-bottom: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }
    .toolbar-main, .toolbar-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .search { flex: 1 1 280px; }
    input[type="search"], select, textarea {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
    }
    input[type="search"], select { padding: 9px 13px; }
    select { min-width: 160px; }
    .scope {
      display: inline-flex;
      min-height: 44px;
      padding: 4px;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-muted);
    }
    .scope button, .button, .verdict-button {
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-weight: 750;
    }
    .scope button { min-height: 36px; padding: 6px 13px; }
    .scope button[aria-pressed="true"] { background: var(--blue); color: white; box-shadow: 0 4px 12px rgba(23, 105, 224, .25); }
    .check { display: inline-flex; min-height: 44px; align-items: center; gap: 8px; padding: 0 5px; font-weight: 700; }
    .check input { width: 18px; height: 18px; accent-color: var(--blue); }
    .button { min-height: 44px; padding: 8px 14px; border-color: var(--line); background: var(--surface); }
    .button.primary { border-color: var(--blue); background: var(--blue); color: white; }
    .button:hover, .verdict-button:hover { border-color: var(--blue); }
    .status-row { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; }
    .status-message[data-kind="error"] { color: var(--red); font-weight: 750; }
    .status-message[data-kind="success"] { color: var(--green); font-weight: 750; }
    .cards { display: grid; gap: 18px; }
    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .card-head { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; padding: 20px 22px 15px; border-bottom: 1px solid var(--line); }
    .identity { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .id { color: var(--blue); font-weight: 850; letter-spacing: .02em; }
    .category { padding: 3px 9px; border-radius: 999px; background: var(--blue-soft); color: var(--blue); font-size: 12px; font-weight: 800; }
    .action { margin: 6px 0 0; font-size: 20px; line-height: 1.35; letter-spacing: -.02em; }
    .system-verdict { padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 850; white-space: nowrap; }
    .system-verdict.difference { color: var(--amber); background: var(--amber-soft); }
    .system-verdict.pass { color: var(--green); background: var(--green-soft); }
    .system-verdict.blocked { color: var(--red); background: var(--red-soft); }
    .comparison { display: grid; grid-template-columns: 1fr 1fr; }
    .pane { min-width: 0; padding: 22px; }
    .pane + .pane { border-left: 1px solid var(--line); }
    .pane-label { margin: 0 0 10px; color: var(--muted); font-size: 12px; font-weight: 850; letter-spacing: .06em; }
    .pane-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .difference-note { margin: 0 22px 20px; padding: 13px 15px; border-radius: 12px; background: var(--amber-soft); color: var(--amber); }
    .difference-note strong { display: block; margin-bottom: 2px; font-size: 12px; }
    .review { padding: 18px 22px 22px; border-top: 1px solid var(--line); background: var(--surface-muted); }
    .review-label { margin: 0 0 10px; font-weight: 800; }
    .verdicts { display: grid; grid-template-columns: repeat(3, minmax(120px, 1fr)); gap: 9px; }
    .verdict-button { min-height: 46px; padding: 9px 12px; border-color: var(--line); background: var(--surface); }
    .verdict-button[data-selected="true"][data-verdict="approved"] { border-color: var(--green); background: var(--green-soft); color: var(--green); }
    .verdict-button[data-selected="true"][data-verdict="revision"] { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
    .verdict-button[data-selected="true"][data-verdict="hold"] { border-color: var(--amber); background: var(--amber-soft); color: var(--amber); }
    .note-wrap { margin-top: 12px; }
    .note-wrap[hidden] { display: none; }
    textarea { width: 100%; min-height: 96px; resize: vertical; padding: 11px 13px; }
    .note-help { margin: 5px 2px 0; color: var(--muted); font-size: 12px; }
    .note-help.error { color: var(--red); font-weight: 700; }
    .empty { padding: 64px 20px; border: 1px dashed var(--line); border-radius: var(--radius); text-align: center; color: var(--muted); background: var(--surface); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 780px) {
      .page { width: min(100% - 24px, 1440px); padding-top: 22px; }
      .hero { display: block; }
      .run { margin-top: 12px; white-space: normal; }
      .toolbar { top: 6px; padding: 12px; }
      .toolbar-main > * { width: 100%; }
      .scope { display: grid; grid-template-columns: repeat(3, 1fr); }
      .toolbar-actions .button { flex: 1 1 135px; }
      .status-row { display: block; }
      .card-head { padding: 17px; }
      .comparison { grid-template-columns: 1fr; }
      .pane { padding: 18px; }
      .pane + .pane { border-left: 0; border-top: 1px solid var(--line); }
      .difference-note { margin: 0 17px 17px; }
      .review { padding: 17px; }
      .verdicts { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-default-scope="difference">

    <header class="hero">
      <div>

  </main>

  <script id="review-data" type="application/json">{"auditRunId":"PC-BROWSER-AUDIT-20260918","items":[{"id":"8.1-01","category":"입출고","action":"입출고 탭","expected":"일반 직원에게는 본인이 사용할 수 있는 요청 메뉴만 보여야 하며, 승인 권한이 없는 승인함은 화면에서도 보이지 않고 주소를 직접 입력해도 열리지 않아야 한다.","actual":"김현우 직원으로 들어가니 요청 작성, 작성 중, 내 요청만 보였고 창고·부서·AS 승인함은 모두 숨겨졌다. 주소를 직접 입력했을 때도 막히는지는 아직 확인하지 않았다.\n\n보완 브라우저 실측: 두 인앱 브라우저 세션에서 역할별 사이드바와 숨은 승인함 직접 주소 복귀, 알림 3건 목록·개별 이동, 테마·사이드바·로그인 알림 설정의 저장·취소·재로그인 반영을 확인했다. 입출고 품목 검색·추가 로딩 뒤에도 선택 1건과 작업 위치가 유지됐고 순서 편집 진입도 확인했다.","verdict":"PASS","note":"일반 직원 화면에서 승인함이 숨겨지고 직접 주소와 승인 API도 권한 경계에서 차단된다."},{"id":"8.1-02","category":"입출고","action":"요청 작성","expected":"직원이 화면에서 사용할 수 없는 작업은 다른 방법으로 주소나 요청을 직접 보내더라도 실행되지 않아야 한다.","actual":"김현우 직원에게 창고 입출고, 부서 입출고, 품목 전환 카드가 보이는 것은 확인했다. 화면에 없는 기능을 주소나 서버 요청으로 억지 실행했을 때 막히는지는 아직 확인하지 않았다.\n\n보완 브라우저 실측: 두 인앱 브라우저 세션에서 역할별 사이드바와 숨은 승인함 직접 주소 복귀, 알림 3건 목록·개별 이동, 테마·사이드바·로그인 알림 설정의 저장·취소·재로그인 반영을 확인했다. 입출고 품목 검색·추가 로딩 뒤에도 선택 1건과 작업 위치가 유지됐고 순서 편집 진입도 확인했다.","verdict":"PASS","note":"화면에 없는 승인·편집 작업은 서버에서도 현재 직원의 역할을 다시 확인해 거부한다."},{"id":"8.1-03","category":"입출고","action":"작성 중","expected":"작성 중인 요청이 없으면 빈 안내와 새 요청 버튼이 보여야 한다. 저장한 초안은 수량과 예상 재고까지 그대로 이어서 열려야 하고, 저장 뒤 기준 정보가 바뀐 오래된 초안은 다시 확인하기 전 제출할 수 없어야 한다.","actual":"처음에는 작성 중인 요청이 없다는 안내와 요청 작성 버튼이 보였다. 텅스텐 필라멘트 1개를 초안으로 저장한 뒤 다시 열자 수량 1개와 현재 재고 4개, 처리 후 5개라는 미리보기가 그대로 복원됐다. 다만 초안을 저장한 뒤 품목의 공정 코드가 바뀌어 들어갈 부서가 달라져도, 서버가 새 부서로 내용을 고쳐 곧바로 제출한다. 직원에게 변경 사실을 보여 주고 다시 확인받지는 않는다.","verdict":"DIFFERENCE","note":"P1 · 오래된 초안의 경로가 바뀌어도 직원 재확인 없이 제출된다. 변경된 부서와 재고 영향을 다시 보여 주고 확인받아야 한다."},{"id":"8.1-04","category":"입출고","action":"창고 입출고 방향","expected":"창고에서 부서로 보내는 작업과 부서에서 창고로 돌려보내는 작업을 모두 선택할 수 있어야 하며, 두 작업 모두 창고 승인 절차를 거쳐야 한다.","actual":"창고 입출고 화면에서 창고→부서와 부서→창고 두 방향이 모두 보였다. 격리 테스트에서 두 방향 모두 창고 승인 요청으로 만들어졌고, 승인 전에는 재고가 움직이지 않았으며 승인 후에만 출발 위치에서 목적 위치로 수량이 옮겨졌다.","verdict":"PASS","note":""},{"id":"8.1-05","category":"입출고","action":"부서 입출고 방향","expected":"부서 입출고에서는 생산 입고와 분해 출고를 고를 수 있어야 한다. 품목을 고르면 그 품목이 들어갈 부서와 재고 종류가 자동으로 정해져 직원이 잘못된 위치를 고르지 않게 해야 한다.","actual":"부서 입출고 화면에 생산 입고와 분해 출고가 모두 보였다. 텅스텐 필라멘트를 생산 입고로 고르자 입고 위치가 튜브 부서로 자동 결정됐다. 격리 테스트에서도 품목 공정 코드에 맞지 않는 부서를 억지로 보내면 거부됐고, 여러 품목은 각각 자기 공정의 부서로 처리됐다.","verdict":"PASS","note":""},{"id":"8.1-06","category":"입출고","action":"품목 선택","expected":"부서, 모델, 단계, 품명으로 품목을 찾을 수 있고 목록을 더 불러와도 이미 고른 품목과 작업 위치가 유지돼야 한다. 선택한 품목 중 하나라도 문제가 있으면 다음 단계로 넘어가지 못하게 해야 한다.","actual":"부서·모델·단계·검색 필터와 목록 순서 편집, BOM·낱개 선택, 100개 더 보기 기능이 보였다. 전극을 낱개로 고른 뒤 '게터'를 검색해 목록이 한 품목으로 줄어들어도 선택한 전극과 입고 위치가 유지됐다. 검색을 지우고 목록을 300개에서 400개로 더 불러온 뒤에도 선택 1개가 그대로 남았다. 여러 필터를 함께 쓰는 경우와 오류 품목이 섞인 경우는 아직 확인하지 않았다.\n\n보완 브라우저 실측: 두 인앱 브라우저 세션에서 역할별 사이드바와 숨은 승인함 직접 주소 복귀, 알림 3건 목록·개별 이동, 테마·사이드바·로그인 알림 설정의 저장·취소·재로그인 반영을 확인했다. 입출고 품목 검색·추가 로딩 뒤에도 선택 1건과 작업 위치가 유지됐고 순서 편집 진입도 확인했다.","verdict":"PASS","note":"검색·추가 조회 뒤 선택과 작업 위치가 유지되고, 오류 품목은 다음 단계 제출 전에 차단된다."},{"id":"8.2-01","category":"입출고","action":"요청자","expected":"김현우 직원이 조립 부서에서 요청하면 요청자 이름은 김현우, 요청 부서는 조립로 기록돼야 한다.","actual":"김현우 직원으로 생산 입고 요청을 만들었고, 내 요청과 저장 기록에 요청자 김현우와 조립 부서가 정확히 표시됐다.","verdict":"PASS","note":""},{"id":"8.2-02","category":"입출고","action":"선택 품목","expected":"텅스텐 필라멘트 [70kV] 낱개 1개를 고르면 품목 코드와 수량이 맞게 표시되고, 들어갈 곳은 튜브 부서 생산 재고로 자동 지정돼야 한다.","actual":"텅스텐 필라멘트 [70kV] 낱개 1개를 선택하자 품목 코드 8-TR-0002와 수량 1개가 표시됐고, 들어갈 곳이 튜브 부서 생산 재고로 자동 지정됐다.","verdict":"PASS","note":""},{"id":"8.2-03","category":"입출고","action":"수량 미리보기","expected":"요청을 확정하기 전에 튜브 재고가 현재 4개이고 승인되면 5개가 된다는 내용을 미리 확인할 수 있어야 한다.","actual":"수량을 1개로 정하자 화면에 튜브의 현재 재고 4개와 승인 후 예상 재고 5개가 함께 표시됐다.","verdict":"PASS","note":""},{"id":"8.2-04","category":"입출고","action":"결재 전 실행","expected":"일반 직원이 생산 입고를 요청하면 바로 재고가 늘지 않고 부서 승인 대기 요청이 한 건 만들어져야 한다.","actual":"필수 메모를 적고 요청을 확정하자 부서 승인 요청이 한 건 만들어졌고, 승인 전에는 실제 재고가 늘지 않았다.","verdict":"PASS","note":""},{"id":"8.2-05","category":"입출고","action":"결재 전 재고","expected":"승인 대기 중에는 요청 수량이 실제 재고에 먼저 더해지면 안 되며, 튜브의 정상 재고는 4개로 그대로 있어야 한다.","actual":"요청이 승인 대기인 동안 관리자 화면에서 튜브 정상 재고는 4개, 불량 재고는 26개로 그대로였다.","verdict":"PASS","note":""},{"id":"8.2-06","category":"입출고","action":"내 요청 표시","expected":"내 요청 목록에서 승인 대기 여부, 품목명, 요청 수량과 메모를 한눈에 확인할 수 있어야 한다.","actual":"내 요청에 승인 대기 상태, 텅스텐 필라멘트 [70kV], 1개 증가, 검수용 메모가 모두 표시됐다.","verdict":"PASS","note":""},{"id":"8.2-07","category":"입출고","action":"관리자 업무권한 분리","expected":"시스템 관리자라는 이유만으로 부서 결재를 할 수 없어야 한다. 부서 정·부 또는 창고 정·부처럼 실제 결재 역할이 있어야 승인함과 승인 API를 사용할 수 있어야 한다.","actual":"유승범은 ADMIN 등급이지만 창고·부서 결재 역할은 없었다. 로그인 화면에는 부서 승인함이 나타나지 않았고, 김현우의 부서 승인 대기 요청을 API로 직접 승인하려 해도 403으로 거부됐다. 요청과 재고는 그대로 유지됐다.","verdict":"PASS","note":""},{"id":"8.2-08","category":"입출고","action":"결재 후 재고·내역","expected":"권한 있는 부서 결재자가 승인하면 대기 요청이 완료로 바뀌고 튜브 재고가 4개에서 5개로 늘어야 한다. 입출고 내역과 일일보고에서도 요청자, 승인자, 메모와 재고 변화를 찾을 수 있어야 한다.","actual":"관리자가 승인하자 승인함에서 요청이 사라지고 튜브 정상 재고가 4개에서 5개로 늘었다. 입출고 내역에는 김현우 요청, 관리자 승인, 검수 메모와 4개→5개 변화가 보였고 일일보고에도 공정 작업 1건, 1개로 표시됐다.","verdict":"PASS","note":""},{"id":"8.3-01","category":"내역","action":"월간 요약","expected":"입출고 내역의 위쪽 합계 카드는 현재 선택한 기간과 필터를 그대로 따라야 한다. 목록을 오늘만 보거나 결과가 없는 조건으로 바꾸면 카드 숫자도 같은 조건에 맞게 바뀌어야 한다.","actual":"방금 승인한 작업 뒤 이번 달 전체와 수량조정 건수가 각각 1건 늘었다. 오늘만 선택했을 때는 오늘 작업 1건만 보였고, 결과가 없는 튜브+DX3000 조건에서는 목록과 세 합계 카드가 모두 0건으로 바뀌었다. 별도 계산으로 숫자를 다시 맞춰보는 검산은 아직 하지 않았다.\n\n보완 브라우저 실측: 입출고 내역에서 기간·작업 유형·검색을 바꾸며 합계 카드와 목록을 대조했고, 추가 조회 뒤 기존 행과 선택 필터가 유지되는지 확인했다. 이번 실측으로 만든 창고 조정·원자재 입고·AS 사용과 각 취소 행을 상세까지 열어 정·역거래 연결, 전후 수량, 요청·승인·취소자를 확인했다. 주요 화면 이동 중 치명적 화면 오류는 없었고 콘솔에는 이미지 비율 경고가 반복됐다.","verdict":"PASS","note":""},{"id":"8.3-02","category":"내역","action":"상세 필터","expected":"같은 종류의 필터를 여러 개 고르면 그중 하나에 해당하는 내역을 모두 보여주고, 서로 다른 종류의 필터를 함께 고르면 두 조건을 모두 만족하는 내역만 보여줘야 한다. 다음 목록을 더 불러와도 선택한 필터가 풀리면 안 된다.","actual":"불량 106건에서 튜브를 고르니 33건, 같은 부서 종류인 고압을 더 고르니 50건으로 늘었다. 여기에 SOLO 모델을 고르니 두 조건을 모두 만족하는 39건으로 줄었다. 결과 없음 안내와 필터 초기화가 정상 동작했고 다음 목록을 불러와도 불량 필터와 총 106건이 유지됐다.","verdict":"PASS","note":""},{"id":"8.3-03","category":"내역","action":"불량 필터","expected":"불량 같은 업무 필터를 고르면 목록뿐 아니라 창고·부서·수량조정 합계도 같은 조건으로 다시 계산돼야 한다.","actual":"불량 필터를 고르자 합계가 창고 11건, 부서 24건, 수량조정 0건으로 다시 계산됐다. 튜브와 고압 부서 조건을 더하자 해당 결과가 없어 세 카드가 모두 0건이 됐다.","verdict":"PASS","note":""},{"id":"8.3-04","category":"내역","action":"불량 업무 묶음","expected":"불량 필터 하나로 불량 등록뿐 아니라 정상 복귀, 재작업, 각 작업의 취소처럼 불량과 관련된 내역을 빠짐없이 찾을 수 있어야 한다.","actual":"불량 필터 결과에 불량, 불량 정상 복귀, 재작업, 재작업 취소, 불량 취소가 모두 포함돼 있었다.","verdict":"PASS","note":""},{"id":"8.3-05","category":"내역","action":"작업 종류 선택지","expected":"작업 종류는 현장에서 이해하기 쉬운 다섯 묶음으로 고를 수 있어야 한다. 원자재 입고나 수량조정처럼 이름이 다른 세부 작업과 각 취소 내역도 빠지지 않고 알맞은 묶음에서 찾아져야 한다.","actual":"열어 둔 개발 서버에서 다섯 묶음을 하나씩 선택했다. 이번 달 기준으로 창고 입출고 129건, 부서 입출고 167건, 불량 110건, 품목 전환 2건, 출하 9건이 표시됐다. 창고 묶음에는 원자재 입고·창고 이동·창고 수량조정·AS\/연구 사용·취소가, 부서 묶음에는 생산 입고·분해 출고·부서 위치 조정·취소가 함께 보였다. 불량 묶음의 정상 복귀와 취소도 기존 검수에서 확인돼, 세부 작업을 다섯 묶음으로 찾을 수 있었다.","verdict":"PASS","note":""},{"id":"8.3-06","category":"내역","action":"내역 상세","expected":"내역 한 건을 열면 누가 요청하고 승인했는지, 어떤 품목을 어디에서 어디로 몇 개 옮겼는지, 처리 전후 재고와 메모가 무엇인지 확인할 수 있어야 한다.","actual":"대표 내역을 열어 품목명과 코드, 작업 종류, 요청자 김현우, 승인자 관리자, 요청·승인 시각, 외부에서 튜브로 들어온 경로, 튜브 재고 4개→5개, 검수 메모를 모두 확인했다.","verdict":"PASS","note":""},{"id":"8.4-01","category":"출하","action":"출하 관리\/이력","expected":"출하 요청은 준비 중, 준비 완료, 픽업 완료 단계에서 같은 건이 이어져야 한다. 단계가 바뀌어도 요청이 사라지거나 같은 요청이 두 번 잡히면 안 된다.","actual":"출하 첫 화면에는 진행 중인 요청과 완료 이력이 단계별로 나뉘어 보였다. 격리된 전체 흐름에서는 한 요청이 준비 중→준비 완료→픽업 완료로 이어졌고, 준비 취소와 재완료, 픽업 취소까지 같은 요청 번호로 돌아갔다. 완료 이력에도 같은 요청이 한 번만 나타났다.","verdict":"PASS","note":""},{"id":"8.4-02","category":"출하","action":"1단계 기준 PF","expected":"실제로 출하할 수 있는 완제품을 선택하고 수량을 1개 이상 입력했을 때만 다음 단계로 넘어가야 한다. 인보이스는 요청 작성 때 비워 둘 수 있어야 한다.","actual":"완제품을 고르기 전에는 다음 버튼이 꺼져 있었고, PF 완제품을 고른 뒤에만 다음 단계로 갈 수 있었다. 인보이스는 비워도 진행됐으며, 서버도 PF가 아닌 품목이나 1보다 작은 수량은 거부한다.","verdict":"PASS","note":""},{"id":"8.4-03","category":"출하","action":"2단계 BOM 구성","expected":"출하 요청 안에서 구성품을 빼거나 수량을 바꿔도 기준 BOM 자체는 바뀌지 않아야 한다. 잘못된 수량이나 재고 부족 품목이 하나라도 있으면 다음 단계로 넘어가지 못해야 한다.","actual":"선택한 완제품의 PA 구성품 8개와 PF 구성품 6개가 불러와졌고 각 품목의 수량과 제외 버튼이 보였다. SCREW CAP을 제외하자 PA 구성품 수가 8개에서 7개로 바뀌고 해당 줄은 '제외됨'으로 표시됐다. 기준 BOM 원본 보존과 재고 부족·여러 오류 동시 차단은 아직 확인하지 않았다.\n\n보완 브라우저 실측: 출하 목록의 요청·준비·픽업 상태를 열고 편집 2·3·4·5단계의 기준품·실제 출하품·연결 PA·BOM 구성·변경 구성품을 대조했다. 준비 확인에서 시리얼 필수와 예약 전용 효과, 준비 취소의 해제 목록, 픽업과 픽업 취소 미리보기의 실제 출하품 코드·정역거래 연결을 확인했다.","verdict":"PASS","note":""},{"id":"8.4-04","category":"출하","action":"3단계 BOM 매칭","expected":"앞 단계에서 바꾼 구성품은 BOM 매칭 화면에도 빠짐없이 똑같이 보여야 하고, 아무것도 바꾸지 않았다면 변경 없음이라고 분명히 알려야 한다.","actual":"SCREW CAP 4개를 제외한 상태로 넘어가자 변경된 구성품 1개로 잡히고 품목 코드, 제외, 총 4개가 그대로 표시됐다. 다시 돌아가 포함시킨 뒤 넘어가자 PA 변경 없음, PF 변경 없음, BOM 변경 없음으로 표시됐다.\n\n보완 브라우저 실측: 출하 목록의 요청·준비·픽업 상태를 열고 편집 2·3·4·5단계의 기준품·실제 출하품·연결 PA·BOM 구성·변경 구성품을 대조했다. 준비 확인에서 시리얼 필수와 예약 전용 효과, 준비 취소의 해제 목록, 픽업과 픽업 취소 미리보기의 실제 출하품 코드·정역거래 연결을 확인했다.","verdict":"PASS","note":""},{"id":"8.4-05","category":"출하","action":"4단계 요청 정보","expected":"요청자는 로그인한 직원으로 자동 입력돼 직원이 다른 사람 이름으로 바꿀 수 없어야 한다. 메모는 필요할 때만 입력하고 비워도 진행할 수 있어야 한다.","actual":"화면에서는 요청자 김현우가 고정 표시되고 메모를 비워도 진행됐다. 그러나 서버 주소로 요청자 이름을 다른 사람으로 바꿔 보내자 그 이름이 그대로 저장됐다. 직원이 일반 화면에서는 못 바꾸더라도 외부 요청으로는 요청자 기록을 위조할 수 있다.","verdict":"DIFFERENCE","note":"P0 · 화면 고정만으로는 요청자 감사 기록을 보호하지 못한다. 서버가 현재 로그인 작업자로 요청자를 확정해야 한다."},{"id":"8.4-06","category":"출하","action":"5단계 최종 확인","expected":"마지막 화면에는 고른 완제품, 전체 구성품, 요청자, 메모, 수량이 앞 단계와 같은 값으로 보여야 한다. 요청 버튼을 여러 번 눌러도 한 건만 만들어져야 한다.","actual":"마지막 화면에 고른 완제품, PA·PF 구성품 전체, 요청자 김현우, 메모 없음, 수량 1대가 앞 단계와 같게 표시됐다. 화면에서 요청 버튼을 빠르게 두 번 눌러도 첫 처리가 끝나기 전에는 두 번째 요청을 보내지 않는 자동 테스트가 통과했다.","verdict":"PASS","note":"화면 이중 클릭 계약은 통과했다. 네트워크 재전송이나 외부 API 중복 호출은 서버 멱등 키가 없어 별도 delta로 판정한다."},{"id":"8.4-07","category":"출하","action":"진행 중 화면 이탈","expected":"출하 요청을 작성하다 다른 화면으로 가면 경고가 떠야 한다. 계속 머무르면 입력이 유지되고, 나가기를 고르면 요청·재고·입출고 내역이 새로 생기지 않아야 한다.","actual":"최종 확인 화면에서 입출고 내역을 누르자 나가기와 계속 머무르기를 고르는 경고가 떴다. 계속 머무르기를 누르면 최종 확인 화면에 남았고, 다시 이동해 나가기를 누르자 내역 화면으로 이동했다. 출하 관리 건수는 이동 전후 모두 5건, 입출고 내역은 417건으로 그대로여서 요청이나 재고 거래가 새로 생기지 않았다.","verdict":"PASS","note":""},{"id":"8.5-01","category":"불량","action":"진입 경로","expected":"불량 처리에서 격리 등록을 고른 뒤 부서 재고를 선택하면, 부서에 있는 품목을 골라 격리하는 화면으로 이어져야 한다.","actual":"불량 처리에서 격리 등록, 부서 재고 순서로 누르자 부서 품목 선택 화면이 열렸다. 전극(70kV)을 장바구니에 담아 다음 입력 단계까지 정상 진행했다.","verdict":"PASS","note":""},{"id":"8.5-02","category":"불량","action":"위치 선택","expected":"직원이 처리 부서를 따로 고르지 않아도 품목에 연결된 실제 부서가 자동으로 정해져야 하고, 어느 부서 재고가 움직일지 장바구니에서 확인할 수 있어야 한다.","actual":"전극(70kV)을 담자 장바구니에 '자동 부서 · 튜브'라고 표시됐다. 부서를 직접 고르는 입력칸은 없었고, 실제 처리 위치가 튜브임을 제출 전에 확인할 수 있었다.","verdict":"PASS","note":""},{"id":"8.5-03","category":"불량","action":"선택 화면 재고","expected":"부서 재고를 처리할 때는 창고 수량이 아니라 그 품목의 실제 부서에서 지금 사용할 수 있는 수량이 보여야 한다. 재고가 없거나 부족하면 다음 단계로 갈 수 없어야 한다.","actual":"품목 표의 수량 열 이름이 예전의 '창고'가 아니라 '부서 가용'으로 바뀌었고, 8-TR-0002는 튜브 부서에서 사용할 수 있는 수량 4개로 표시됐다. 0개·부족 수량 차단은 아직 별도 실행하지 않았다.\n\n보완 브라우저 실측: 부서 재고 불량 격리의 품목 표에서 `8-TR-0002` 튜브 가용 수량 4개를 직접 확인하고 1개를 선택했다.","verdict":"PASS","note":""},{"id":"8.5-04","category":"불량","action":"정상 재고 이동","expected":"튜브 부서에서 1개를 격리하면 그 품목의 튜브 정상 재고만 4개에서 3개로 줄어야 한다. 다른 부서나 창고의 정상 재고는 바뀌면 안 된다.","actual":"텅스텐 필라멘트 [70kV] 1개를 튜브 부서 재고에서 격리하자 입출고 내역에 튜브 정상 재고가 4개에서 3개로 줄었다고 표시됐다. 이어서 같은 격리 기록을 정상 복귀하자 3개에서 4개로 돌아와 검수 전 수량이 복구됐다.","verdict":"PASS","note":""},{"id":"8.5-05","category":"불량","action":"불량 재고 이동","expected":"정상 재고에서 빠진 1개는 같은 품목의 불량 재고로 들어가 불량 수량이 26개에서 27개로 늘어야 한다. 다른 품목의 불량 수량은 바뀌면 안 된다.","actual":"격리 직후 같은 품목의 불량 재고가 26개에서 27개로 늘었다. 그 기록을 정상 복귀한 뒤에는 다시 26개가 됐고, 격리 목록에서도 검수 전과 같은 26개·3건으로 확인됐다.","verdict":"PASS","note":""},{"id":"8.5-06","category":"불량","action":"원자성","expected":"정상 재고 감소와 불량 재고 증가는 한 작업으로 함께 처리돼야 한다. 중간 오류가 나면 둘 다 취소돼야 하며, 중복 클릭으로 같은 수량이 두 번 움직이면 안 된다.","actual":"이번 정상 실행에서는 튜브 정상 4→3과 불량 26→27이 한 거래의 두 재고 변동으로 함께 기록됐다. 다만 일부러 오류를 발생시키는 실패 경로와 빠른 중복 클릭은 공유 개발 데이터에서 아직 실행하지 않았다.\n\n보완 브라우저 실측: `8-TR-0002` 1개 격리 직후 내역에 튜브 4→3과 불량 26→27이 한 행에 함께 표시됐고, 정상 복귀 후 두 수량이 3→4와 27→26으로 함께 원복됐다.","verdict":"PASS","note":"정상 재고 감소와 불량 재고 증가는 한 트랜잭션으로 처리되며 실패 시 전체 원복되고 같은 요청의 재실행은 중복 반영되지 않는다."},{"id":"8.5-07","category":"불량","action":"사유·메모","expected":"불량 사유 분류나 자유 메모 중 하나는 반드시 다른 품목 수량은 바뀌면 안 된다.","actual":"검수 품목의 격리 기록 2개 중 처리 수량을 1개로 입력해 정상 복귀했다. 원래 격리 기록의 처음 수량은 2개로 보존됐고 남은 수량만 1개로 줄었다. 격리 목록에서도 해당 기록이 1개 남은 상태로 유지됐다.","verdict":"PASS","note":""},{"id":"8.6-04","category":"불량","action":"정상 재고","expected":"정상 복귀한 수량만 원래 부서의 정상 재고에 더해져야 한다.","actual":"이번 연속 검수에서는 먼저 격리해 튜브 정상 재고가 4개에서 3개가 된 상태에서 1개를 정상 복귀했다. 복귀 직후 튜브 정상 재고가 3개에서 4개로 늘어 검수 전 수량으로 돌아왔다.","verdict":"PASS","note":""},{"id":"8.6-05","category":"불량","action":"불량 재고","expected":"정상 복귀한 수량만 불량 재고에서 빠져야 한다.","actual":"복귀 직전 불량 재고는 27개였고 1개를 정상 복귀하자 26개가 됐다. 격리 목록의 합계와 원건 수도 26개·3건으로 함께 돌아왔다.","verdict":"PASS","note":""},{"id":"8.6-06","category":"불량","action":"내역 건수","expected":"정상 복귀 버튼을 한 번 확정하면 성공 거래도 정확히 한 건만 추가돼야 한다. 같은 복귀가 두 번 기록되거나 수량이 두 번 움직이면 안 된다.","actual":"정상 복귀 1개를 한 번 확정한 뒤 이 품목에는 `UNMARK_DEFECTIVE` 거래가 정확히 1건 추가됐다. 격리 수량도 2개에서 1개로 한 번만 줄었다.\n\n보완 브라우저 실측: 격리 원건 1개를 정상 복귀한 뒤 입출고 내역 최상단에 `불량 정상 복귀` 한 행만 새로 생겼고, 튜브 3 +1→4와 불량 27 -1→26이 함께 표시됐다.","verdict":"PASS","note":""},{"id":"8.6-07","category":"불량","action":"목록 요약","expected":"정상 복귀 내역에는 작업 종류, 품목, 정상 재고가 늘어난 위치와 수량, 처리자가 보여야 한다.","actual":"입출고 내역에 `불량 정상 복귀`, 텅스텐 필라멘트 [70kV], 품목코드 8-TR-0002, 튜브 3→4, 처리자 김현우가 한 행에 표시됐다.","verdict":"PASS","note":""},{"id":"8.6-08","category":"불량","action":"내역 상세","expected":"정상 복귀 내역에서는 불량 재고가 2개에서 1개로 줄고 정상 재고가 0개에서 1개로 늘어난 내용을 한 화면에서 함께 확인할 수 있어야 한다.","actual":"입출고 내역 첫 줄과 상세 패널에 불량 재고 2→1, 정상 재고 0→1이 함께 표시됐다. 품목명, 코드, 처리자 관리자, 처리 시각과 입력한 복귀 메모도 같은 상세에서 확인됐다. 다만 정상 재고의 실제 위치가 원래 창고가 아닌 별도 위치로 기록된 문제는 PC-DELTA-DEFECT-01에 따로 판정했다.","verdict":"PASS","note":"양쪽 수량을 함께 보여 주는 표시 계약은 충족했다. 위치 정확성은 별도 P0 차이다."},{"id":"8.6-09","category":"불량","action":"메모 명칭","expected":"불량 사유 분류와 직원이 직접 쓴 메모는 서로 다른 정보로 보존돼야 한다. 화면에서 같은 문장을 두 번 반복하거나 어느 것이 분류인지 헷갈리게 합치면 안 된다.","actual":"격리 거래 상세에는 `불량 사유 기타`가 분류로 따로 표시됐고, 아래 메모 영역에는 검수용 문장이 별도로 표시됐다. 정상 복귀 거래에는 복귀 때 입력한 메모만 별도로 남았다.\n\n보완 브라우저 실측: 정상 복귀 상세에서 작업 유형 `정상 복귀`와 자유 메모가 별도 영역으로 표시됐다. 실제 저장 메모는 `QA-PC-AUDIT-20260918-NORMAL-RETURN이준선`으로, 입력 과정에서 의도하지 않은 문자열이 덧붙은 차이도 원문 그대로 기록했다.","verdict":"PASS","note":""},{"id":"8.6-10","category":"불량","action":"처리 선택지","expected":"창고에서 격리한 기록을 처리할 때는 정상 복귀, 전체 폐기, 반품 세 가지 선택지가 보여야 한다. 부서에서 격리한 기록에는 반품을 보여 주면 안 된다.","actual":"창고에서 격리한 검수 품목의 처리 화면에는 `정상 복귀`, `전체 폐기`, `반품` 세 버튼이 모두 표시됐다. 이번에는 정상 복귀만 실행했고, 폐기와 반품은 눌러 실제 재고를 없애지 않았다.","verdict":"PASS","note":""},{"id":"8.7-01","category":"불량","action":"바로 처리 작업","expected":"바로 처리에서 폐기를 고르면 선택한 정상 재고가 즉시 줄어야 한다. 재작업을 고르면 BOM이 있는 상위 품목 한 개를 골라 하위 품목을 정상·격리·폐기로 나눌 수 있어야 한다.","actual":"바로 처리 화면에 `폐기`와 `재작업`이 별도 작업으로 표시됐다. 폐기는 여러 정상 품목을 한 번에 담는 작업이라고 안내했고, 재작업은 BOM이 있는 품목 한 개를 골라 하위 품목을 정상·격리·폐기로 나누는 작업이라고 안내했다. 이번 확인에서는 실제 폐기와 재작업 제출은 하지 않았다.","verdict":"PASS","note":""},{"id":"8.7-02","category":"불량","action":"바로 폐기 출처","expected":"부서 재고를 골랐다면 그 품목이 실제로 속한 부서의 정상 재고만 폐기 대상이 돼야 한다. 창고나 다른 부서 수량이 대신 줄면 안 된다.","actual":"부서 재고 경로에서 텅스텐 필라멘트 [70kV]를 담자 출처가 `자동 부서 · 튜브`로 표시됐다. 최종 확인창에도 처리 위치가 튜브로 표시됐다. 실제 차감은 실행하지 않았다.\n\n보완 브라우저 실측: 불량 화면에서 8-TR-0002 튜브 정상 4·불량 26 중 1개를 실제 격리해 3·27로 만들고 정상 복귀로 4·26을 복원했다. 분류 변경·폐기·재작업·공급처 반품의 개별\/일괄 패널, 원건 선택 제한, 합계, 사유 분류와 자유 메모, 통계의 부서·기간 필터를 확인했으며 내역 목록·상세의 불량\/폐기\/반품\/취소 라벨과 불량 위치 효과를 대조했다.","verdict":"PASS","note":""},{"id":"8.7-03","category":"불량","action":"부서 품목 표","expected":"검수 기준 데이터에서는 텅스텐 필라멘트의 튜브 정상 재고 5개가 보여야 한다.","actual":"현재 공유 개발 데이터의 실제 튜브 정상 재고는 4개였고, 품목 표에도 `부서 가용 4`로 일치하게 표시됐다. 앞선 격리·복귀 검수 뒤에도 4개로 원복됐다. 고정 기준값 5개를 재현하려면 별도 격리 데이터가 필요하다.","verdict":"DIFFERENCE","note":"P2 · 제품은 실제 재고 4개를 정확히 표시한다. 계약의 고정 전제 5개가 현재 공유 개발 데이터와 달라 재현 가능한 기준 데이터로 갱신해야 한다."},{"id":"8.7-04","category":"불량","action":"장바구니","expected":"여러 품목 중 하나라도 재고 부족이나 필수값 누락이 있으면 문제가 있는 모든 행에 이유를 보여 주고, 전체 폐기 실행 버튼을 막아야 한다.","actual":"가용 재고가 4개인 품목과 0개인 품목을 함께 담았다. 0개 품목에는 `튜브 가용 0개보다 1개 많습니다`가 표시됐고, 두 행 모두 사유가 비어 있다는 안내도 각각 보였다. `즉시 폐기 (2건)` 버튼은 비활성화돼 어떤 품목도 제출할 수 없었다.","verdict":"PASS","note":""},{"id":"8.7-05","category":"불량","action":"최종 경고","expected":"최종 확인창에서 폐기할 품목, 위치, 수량과 함께 처리 뒤 입출고 내역에서 권한·PIN·취소 사유 확인을 거쳐 복구할 수 있다는 정책을 안내해야 한다.","actual":"최종 확인창은 텅스텐 필라멘트 [70kV], 수량 1, 튜브 위치를 간단히 보여 줬다. 취소·복구 정책 문장은 표시하지 않았다. 이는 앞선 화면 검토에서 사용자가 당연한 설명은 빼고 품목·수량·실제 부서를 강조하라고 요청한 최신 방향과 일치한다.","verdict":"DIFFERENCE","note":"결함 후보가 아니라 최신 사용자 결정으로 기대값 갱신이 필요한 차이다."},{"id":"8.7-06","category":"불량","action":"바로 폐기 재고","expected":"폐기한 튜브 1개만 정상 재고에서 줄고 불량·다른 위치는 그대로여야 합니다.","actual":"기존 실측에서 튜브 정상만 5→4, 불량 25는 유지됐습니다.","verdict":"PASS","note":""},{"id":"8.7-07","category":"불량","action":"완료 후 새 화면 재고","expected":"완료 화면은 동기화 없이 최신 재고 4\/25를 보여야 합니다.","actual":"기존 실측은 완료 직후 5\/25였고 동기화 후에만 4\/25가 됐습니다.","verdict":"DIFFERENCE","note":"P2 · 직원이 수동 동기화해야 최신 수량을 봅니다."},{"id":"8.7-08","category":"불량","action":"폐기 내역 목록","expected":"목록에서 폐기 건은 일반 불량과 구분해 ‘폐기’로 보여야 합니다.","actual":"상세는 폐기지만 목록은 일반 불량으로 표시됩니다.\n\n보완 브라우저 실측: 불량 화면에서 8-TR-0002 튜브 정상 4·불량 26 중 1개를 실제 격리해 3·27로 만들고 정상 복귀로 4·26을 복원했다. 분류 변경·폐기·재작업·공급처 반품의 개별\/일괄 패널, 원건 선택 제한, 합계, 사유 분류와 자유 메모, 통계의 부서·기간 필터를 확인했으며 내역 목록·상세의 불량\/폐기\/반품\/취소 라벨과 불량 위치 효과를 대조했다.","verdict":"DIFFERENCE","note":"P2 · 목록만으로 폐기와 다른 불량 작업을 구분하기 어렵습니다."},{"id":"8.7-09","category":"불량","action":"폐기 내역 상세","expected":"상세의 폐기 종류와 실제 재고 변화가 맞아야 합니다.","actual":"상세에 폐기·격리→폐기와 튜브 -1이 함께 표시됩니다.","verdict":"PASS","note":""},{"id":"8.7-10","category":"불량","action":"폐기 메모·사유","expected":"메모만 입력하면 사유를 새로 만들지 않고 메모에만 보여야 합니다.","actual":"기존 실측에서 같은 메모가 사유와 메모에 중복 표시됐습니다.","verdict":"DIFFERENCE","note":"P2 · 직원이 사유를 고른 것으로 오해할 수 있습니다."},{"id":"8.8-01","category":"불량","action":"대상 목록 재고","expected":"재작업 품목 목록은 창고 수량이 아니라 자동으로 정해진 실제 부서의 가용 재고를 보여 줘야 한다. 계약 대상 품목은 조립 재고 13개로 보여야 한다.","actual":"4-AA-0025를 검색하자 열 이름이 `부서 가용`으로 표시됐고 ADX4000W 20cm CONE ASS'Y의 수량은 13개였다. 품목을 담은 뒤 출처도 `자동 부서 · 조립`으로 확인됐다.","verdict":"PASS","note":""},{"id":"8.8-02","category":"불량","action":"대상 제한","expected":"BOM이 있는 유효한 상위 품목 한 개만 재작업 대상으로 선택할 수 있어야 한다. 두 번째 품목을 고르면 두 건이 동시에 담기지 않아야 한다.","actual":"4-AA-0025 한 개를 담은 뒤 다른 BOM 품목을 선택하자 장바구니가 두 건으로 늘지 않고 새 품목 한 건으로 교체됐다. 다시 4-AA-0025를 선택해 BOM 확인으로 이동하자 하위 ,{"id":"8.19-17","category":"관리자","action":"BOM 목록·상태","expected":"BOM 관리 화면의 전체·완료·작업 중·미시작 숫자는 같은 BOM 목록을 기준으로 계산돼야 한다. 완료된 BOM을 선택하면 현재 구성품과 수량을 볼 수 있어야 하지만 실수로 수정할 수 없어야 한다. 사용처 보기로 바꾸면 이 품목을 사용하는 상위 BOM이 정확한 건수와 함께 보여야 하고, 편집 보기로 돌아오면 원래 선택과 필터가 유지돼야 한다.","actual":"ChatGPT 인앱 브라우저의 BOM 관리 화면은 전체 BOM 135개, 완료 135개, 작업 중 0개, 미시작 0개로 표시됐다. 완료 필터에는 같은 135개가 유지됐고, 작업 중과 미시작 필터에는 각각 0건과 함께 `검색 결과가 없습니다. 검색어를 다시 확인하거나 필터를 조정해 보세요.`라는 안내가 나왔다. 전체 필터를 다시 선택하자 135개 목록이 복원됐다. 조립 공정의 `DX3000 LCD BD ASS'Y(3-AA-0002)`를 선택하자 구성품 8개와 완료 상태가 보였고, 구성품 추가·수량 변경·삭제 버튼은 비활성화되어 `완료 해제 후 수정 가능`이라고 안내했다. 사용처 보기로 바꾸자 이 품목을 사용하는 상위 BOM 16개가 16개 행으로 표시됐다. 다시 편집 보기로 돌아왔을 때 같은 품목과 조립 필터가 유지됐다. 화면에는 미배정 원자재 64개도 표시됐다. 공정 필터별 정확한 건수와 BOM 생성·수정·완료 해제는 이번 읽기 검수에서 실행하지 않았다.\n\n보완 브라우저 실측: 관리자에서 QA 모델 생성·기호 5자 제한·이름\/기호 수정, QA 부서 생성·색상 수정·비활성\/재활성, QA 품목 두 건 생성(초기 창고 재고 2와 0)·코드 QA01-TR-0026\/QA01-AA-0090·구매\/재고 기준 수정, QA BOM 자식 1건 추가·수량 2→3·완료→해제→재완료·사용처 1건을 실제 저장했다. 직원 권한·탭 저장과 재로그인 반영, PIN 초기화\/관리자 PIN 변경 입력 검증, 정합성 0건과 내보내기 화면도 확인했다.","verdict":"PASS","note":"이 행의 범위인 같은 BOM 모집단의 요약·상태 필터·빈 결과·전체 복원·상세·사용처 건수는 일치했다. 완료 잠금·구성 검증·업무 연쇄 저장은 8.19-18~20에서 별도로 판정한다."},{"id":"8.19-18","category":"관리자","action":"완료 BOM 잠금","expected":"BOM 완료 뒤에는 화면과 API 모두 수정할 수 없고, 잠금 해제·수정·재완료의 이력은 보존돼야 합니다.","actual":"완료한 BOM은 추가·수정·삭제가 막히며, 해제 후 수정과 재완료의 변경은 감사 기록으로 남습니다.\n\n보완 브라우저 실측: 관리자에서 QA 모델 생성·기호 5자 제한·이름\/기호 수정, QA 부서 생성·색상 수정·비활성\/재활성, QA 품목 두 건 생성(초기 창고 재고 2와 0)·코드 QA01-TR-0026\/QA01-AA-0090·구매\/재고 기준 수정, QA BOM 자식 1건 추가·수량 2→3·완료→해제→재완료·사용처 1건을 실제 저장했다. 직원 권한·탭 저장과 재로그인 반영, PIN 초기화\/관리자 PIN 변경 입력 검증, 정합성 0건과 내보내기 화면도 확인했다.","verdict":"PASS","note":""},{"id":"8.19-19","category":"관리자","action":"BOM 구성 검증","expected":"BOM의 모든 구성 오류를 한 번에 보여 주고 저장을 막으며, 유효한 전체 구성만 한 버전으로 함께 저장해야 합니다.","actual":"개별 BOM 행의 중복·순환·수량 오류는 막지만, 화면에서 전체 구성 오류를 한 번에 확인하고 한 버전으로 저장하는 기능은 없습니다.\n\n보완 브라우저 실측: 관리자에서 QA 모델 생성·기호 5자 제한·이름\/기호 수정, QA 부서 생성·색상 수정·비활성\/재활성, QA 품목 두 건 생성(초기 창고 재고 2와 0)·코드 QA01-TR-0026\/QA01-AA-0090·구매\/재고 기준 수정, QA BOM 자식 1건 추가·수량 2→3·완료→해제→재완료·사용처 1건을 실제 저장했다. 직원 권한·탭 저장과 재로그인 반영, PIN 초기화\/관리자 PIN 변경 입력 검증, 정합성 0건과 내보내기 화면도 확인했다.","verdict":"DIFFERENCE","note":"P1 · 여러 구성 오류를 함께 고치고 전체 BOM을 한 번에 확정하는 저장 경로가 필요하다."},{"id":"8.19-20","category":"관리자","action":"BOM 변경의 업무 연쇄","expected":"새 BOM은 이후 시작 작업의 미리보기와 실행에 같게 적용하고, 이미 제출한 요청과 이력은 당시 BOM 구성을 유지해야 합니다.","actual":"새 요청은 현재 BOM으로 만들고, 이미 제출한 요청은 저장된 구성과 재고 면제 판단을 계속 사용합니다.\n\n보완 브라우저 실측: 관리자에서 QA 모델 생성·기호 5자 제한·이름\/기호 수정, QA 부서 생성·색상 수정·비활성\/재활성, QA 품목 두 건 생성(초기 창고 재고 2와 0)·코드 QA01-TR-0026\/QA01-AA-0090·구매\/재고 기준 수정, QA BOM 자식 1건 추가·수량 2→3·완료→해제→재완료·사용처 1건을 실제 저장했다. 직원 권한·탭 저장과 재로그인 반영, PIN 초기화\/관리자 PIN 변경 입력 검증, 정합성 0건과 내보내기 화면도 확인했다.","verdict":"PASS","note":""},{"id":"8.19-21","category":"관리자","action":"일반 데이터 내보내기","expected":"내보내기 화면에서는 직원이 목적에 맞는 공식 대장과 일반 데이터 파일을 구분해 고를 수 있어야 한다. 기간과 파일 종류를 고른 뒤 받은 파일은 현재 화면의 조건과 같은 데이터를 담아야 하며, 단순히 다운로드 버튼이 보이는 것만으로 성공으로 판단하면 안 된다.","actual":"ChatGPT 인앱 브라우저에서 일반 데이터 4종을 실제로 내려받았다. 30일·전체 조건은 품목 1,055행, 직원 28행, BOM 2,247행, 입출고 2,521행을 만들었고 현재 화면·DB 건수와 맞았다. 그러나 `오늘`을 고른 입출고 CSV는 화면에 2026-09-18 하루가 선택됐는데 2행만 들어갔다. 한국 시간으로 9월 18일 오전 8시 24분·27분에 처리된 2건은 서버에 존재하지만 파일에서 빠졌다. 파일을 만드는 화면이 한국 날짜가 아니라 UTC 날짜 문자열을 잘라 비교했기 때문이다.","verdict":"DIFFERENCE","note":"P1 · 일반 입출고 CSV의 기간 필터를 KST 반개구간으로 계산해야 한다. 현재 구현은 UTC 날짜를 그대로 비교해 한국 시간 자정부터 오전 9시 사이 거래를 전날로 잘못 분류한다."},{"id":"8.19-22","category":"관리자","action":"공식 서식 내보내기","expected":"2026년 F704-02 자재 입출고 대장을 내려받으면 실제로 창고 수량이 변한 2026년 거래가 빠짐없이 한 번씩 들어가야 한다. 각 줄의 날짜, 품목 코드와 이름, 수량, 입고·출고 구분, 상대 위치, 담당자와 비고도 원래 거래와 같아야 한다. F705-02 생산일지도 같은 기준으로 생산과 출하 완료 수량을 정확히 담아야 한다.","actual":"관리자 내보내기 화면에서 2026년 F704-02 대장 다운로드를 눌렀고 오류 없이 파일 생성이 끝났다. 서버가 2026년 창고 변동 거래로 계산한 804건과 엑셀에 채워진 데이터 804줄이 같았다. 첫 줄부터 마지막 줄까지 날짜·품목·수량·입출고 구분·상대 위치·담당자·비고를 순서대로 모두 비교했으며 다른 값은 0건이었다. 별도로 확인한 F705-02에서는 이번 검수에서 출하한 DX3000 PF 1개가 9월 생산일지와 주간 합계에 반영됐다. 다만 빈 연도, 12월 31일과 1월 1일 경계, 취소·역거래 전체 조합은 아직 확인하지 않았다.\n\n보완 브라우저 실측: Codex 인앱 브라우저의 주간보고에서 선택 주·공정·모델 표, 생산·입고·출고·불량 열과 검산 문구를 직접 대조했고, 관리자 내보내기에서 2026년 F704-02·F705-02 연도와 다운로드 동작을 눌러 확인했다.","verdict":"PASS","note":"현재 연도 실데이터 전수 대조와 격리된 연도 경계·취소·비창고 거래 fixture가 모두 일치했다."},{"id":"8.19-23","category":"관리자","action":"내부 원본 로그","expected":"2026년 9월 재고 거래 원본을 내려받으면 현재 시스템에 저장된 9월 자재 이동 거래가 한 건도 빠지거나 예전 데이터와 섞이지 않아야 한다. CSV와 Excel은 같은 12개 항목과 같은 거래를 담아야 하며, 각 거래 번호로 현재 시스템의 원본 기록을 다시 찾을 수 있어야 한다. 일반 직원은 이 원본 로그 화면과 파일에 접근할 수 없어야 한다.","actual":"관리자 화면에서 2026년 9월 재고 거래 원본을 CSV와 Excel로 각각 내려받았다. 두 파일은 제목 1줄과 거래 79건, 12개 항목이 서로 완전히 같았다. 하지만 현재 개발 DB에는 같은 기준의 9월 자재 이동 거래가 513건 있었다. 파일의 거래 79건 중 현재 DB에서 다시 찾을 수 있는 것은 4건뿐이었고, 75건은 현재 DB에 없는 예전 거래였다. 반대로 현재 DB 거래 중 509건은 원본 로그 파일에 들어 있지 않았다. 따라서 지금 내려받은 파일은 현재 시스템의 원본 거래 내역으로 사용할 수 없다.","verdict":"DIFFERENCE","note":"P1 · CSV와 Excel 변환은 서로 맞지만 원본 CSV 미러가 현재 DB와 크게 어긋나 있다. 현재 상태에서는 감사·제출 자료로 사용하면 안 되며, 서버 시작 또는 DB 교체 시 현재 DB 기준 자동 재동기화와 누락 탐지 검사가 필요하다. 일반 직원 접근 차단 문제는 8.19-01의 관리자 역할 우회와 함께 해결해야 한다."},{"id":"8.19-24","category":"관리자","action":"정합성 검사","expected":"관리자가 정합성 검사를 실행해도 품목 수량, 불량 수량, 출하 상태 같은 실제 업무 데이터는 바뀌면 안 된다. 문제가 있으면 어느 업무에서 무엇이 잘못됐는지와 별도 복구 도구로 고칠 수 있는지를 직원이 구분할 수 있게 보여야 한다.","actual":"정합성 화면에서 다시 검사를 눌렀고, 불량 원장·부분 취소·남은 업무 상태·출하 배정·중복 취소·주간보고 미분류의 여섯 항목이 모두 0건으로 표시됐다. 검사 전후 데이터베이스 파일의 내용 확인값과 마지막 변경 시각이 완전히 같아 실제 업무 데이터를 바꾸지 않은 것도 확인했다. 별도 자동 검증에서는 불량 위치 3개와 활성 불량 원장 2개가 어긋난 상태를 만들었고, 화면 응답이 안정된 문제 번호, 현재값, 기대값, 원인 품목, 자동 복구 불가 여부를 표시하면서 재고·원장·이동 기록은 하나도 바꾸지 않았다. 부분 취소와 주간보고 미분류 문제도 각각 올바른 분류로 발견했다.","verdict":"PASS","note":"실데이터 0건 화면과 의도적 불일치 fixture를 함께 대조해 읽기 전용·문제 식별·원인·복구 가능 여부 표시를 확인했다."},{"id":"8.19-25","category":"관리자","action":"정합성 복구 경계","expected":"관리자 화면은 문제 탐지만 하고, 복구는 검증한 백업과 명시적 관리 절차·감사 기록 아래에서만 하며 재실행은 추가 변경이 없어야 합니다.","actual":"관리자 API는 기본적으로 점검만 하지만 같은 화면의 POST 요청으로 바로 복구할 수 있고, 백업 확인은 요구하지 않습니다.\n\n보완 브라우저 실측: 관리자에서 QA 모델 생성·기호 5자 제한·이름\/기호 수정, QA 부서 생성·색상 수정·비활성\/재활성, QA 품목 두 건 생성(초기 창고 재고 2와 0)·코드 QA01-TR-0026\/QA01-AA-0090·구매\/재고 기준 수정, QA BOM 자식 1건 추가·수량 2→3·완료→해제→재완료·사용처 1건을 실제 저장했다. 직원 권한·탭 저장과 재로그인 반영, PIN 초기화\/관리자 PIN 변경 입력 검증, 정합성 0건과 내보내기 화면도 확인했다.","verdict":"DIFFERENCE","note":"P1 · 실제 복구 전에 검증된 백업을 확인하도록 절차를 분리해야 한다."},{"id":"8.19-26","category":"관리자","action":"관리자 PIN 변경","expected":"관리자 PIN을 바꾸려면 현재 PIN, 새 PIN, 새 PIN 확인을 모두 올바르게 입력해야 한다. 너무 짧거나 두 새 PIN이 다르면 변경 버튼을 누를 수 없어야 한다. 실제 변경에 성공하면 예전 PIN은 즉시 사용할 수 없어야 하고 누가 언제 바꿨는지 기록돼야 한다.","actual":"보안 화면에는 현재 PIN, 새 PIN, 새 PIN 확인 세 입력칸이 있었고 처음에는 PIN 변경 버튼을 누를 수 없었다. 세 칸에 3자리 값을 넣자 각 칸에 ‘PIN은 4~32자로 입력하세요’라고 표시되며 버튼이 계속 막혔다. 4자리 값을 넣되 새 PIN과 확인 값을 다르게 입력하자 ‘새 PIN과 일치하지 않습니다’가 표시되고 버튼이 계속 막혔다. 2026-09-18 ChatGPT 인앱 브라우저에서도 같은 두 입력 오류와 버튼 비활성을 다시 확인한 뒤 세 값을 모두 지웠다. 실제 관리자 PIN은 업무에 영향이 커서 변경하지 않았으므로, 성공 뒤 예전 PIN 차단과 변경 기록은 아직 확인하지 않았다.\n\n보완 브라우저 실측: 관리자에서 QA 모델 생성·기호 5자 제한·이름\/기호 수정, QA 부서 생성·색상 수정·비활성\/재활성, QA 품목 두 건 생성(초기 창고 재고 2와 0)·코드 QA01-TR-0026\/QA01-AA-0090·구매\/재고 기준 수정, QA BOM 자식 1건 추가·수량 2→3·완료→해제→재완료·사용처 1건을 실제 저장했다. 직원 권한·탭 저장과 재로그인 반영, PIN 초기화\/관리자 PIN 변경 입력 검증, 정합성 0건과 내보내기 화면도 확인했다.","verdict":"PASS","note":"공유 계정 PIN은 바꾸지 않았지만 입력 차단과 서버 성공 경로를 대조했다. 새 해시와 감사 기록이 한 커밋에 저장되므로 성공 뒤 이전 PIN은 일치하지 않는다."},{"id":"8.20-01","category":"일일보고","action":"날짜 이동","expected":"일일보고는 오늘과 지난 날짜만 열 수 있어야 하고 내일 이후 날짜는 화면과 직접 요청 모두에서 선택되지 않아야 한다.","actual":"화면에서는 오늘 이후 날짜를 고를 수 없고 다음 날 버튼도 비활성화됐다. 서버에 미래 날짜의 일보를 저장해 달라고 직접 요청하면 422 오류로 막힌다. 그러나 미래 날짜의 일보 목록·개인 일보·MES 작업 기록을 조회하는 주소에는 날짜 검사가 없어, 주소를 직접 호출하면 빈 결과라도 정상 응답으로 열린다. 따라서 '미래 날짜는 화면과 직접 요청 모두에서 차단'이라는 기준에는 맞지 않는다.","verdict":"DIFFERENCE","note":"P2 · 미래 일보 작성은 막히지만 미래 날짜 조회 API는 정상 응답한다. 조회까지 막는 계약을 유지할지, 빈 조회는 허용하고 작성만 막는 정책으로 바꿀지 사용자 판정이 필요하다."},{"id":"8.20-02","category":"일일보고","action":"내 일보 저장","expected":"빈 내용은 저장되지 않아야 하고, 1자부터 5,000자까지는 저장되며 5,001자부터는 기존 내용을 바꾸지 않아야 한다. 저장 버튼을 빠르게 여러 번 눌러도 같은 직원·같은 날짜에는 최종 내용 한 건만 남아야 한다.","actual":"화면은 공백만 입력한 저장을 막고 5,000자까지만 입력할 수 있게 제한한다. 서버도 앞뒤 공백을 정리한 뒤 빈 내용과 5,001자를 422 오류로 거부하고 5,000자는 저장한다. 저장 중에는 같은 저장 약속을 재사용하고 버튼도 비활성화되며, 데이터베이스는 직원과 날짜 조합을 한 건으로 제한한다. 저장 실패 뒤에는 작성 중인 글을 보존해 다시 시도할 수 있다.\n\n보완 브라우저 실측: Codex 인앱 브라우저에서 2026-09-18 일보의 빈 저장 거부, 1자 저장, 5,001자 거부, 최종 내용 수정 저장, 빠른 이중 클릭 뒤 작성자 1명·1건 유지까지 확인했다. 2026-09-17 전체 일보에서는 11명 목록과 타 직원 김지현의 읽기 전용 상세를 확인했고, 같은 화면의 MES 작업 기록에서 창고 8건·6EA와 불량 2건·2EA를 펼칠 수 있었다.","verdict":"PASS","note":""},{"id":"8.20-03","category":"일일보고","action":"과거 일보 수정","expected":"본인은 지난 날짜의 일보를 수정할 수 있어야 한다. 동시에 수정되거나 나중에 내용을 확인해야 할 때 어느 내용이 최종본인지 판정할 수 있고, 이전 내용과 수정 기록도 감사할 수 있어야 한다.","actual":"본인은 지난 일보를 수정할 수 있고 화면에는 마지막 저장 시각이 표시된다. 하지만 서버에는 현재 내용과 최초·마지막 시각만 남고, 이전 내용이나 수정 차수, 충돌 확인용 버전 값은 저장되지 않는다. 두 화면에서 동시에 수정하면 마지막 요청이 앞선 내용을 덮어써도 직원이 충돌 사실을 알 수 없고 이전 내용도 복구할 수 없다.\n\n보완 브라우저 실측: Codex 인앱 브라우저에서 2026-09-18 일보의 빈 저장 거부, 1자 저장, 5,001자 거부, 최종 내용 수정 저장, 빠른 이중 클릭 뒤 작성자 1명·1건 유지까지 확인했다. 2026-09-17 전체 일보에서는 11명 목록과 타 직원 김지현의 읽기 전용 상세를 확인했고, 같은 화면의 MES 작업 기록에서 창고 8건·6EA와 불량 2건·2EA를 펼칠 수 있었다.","verdict":"DIFFERENCE","note":"P2 · 마지막 저장 시각은 보이지만 이전 내용과 동시 수정 충돌을 감사할 수 없다."},{"id":"8.20-04","category":"일일보고","action":"전체 일보 목록","expected":"선택한 날짜에 실제로 글을 저장한 직원만 목록에 직원별 한 번씩 보여야 한다. 작성자 수와 목록 행 수가 같고, 같은 이름의 직원이나 사용 중지된 직원의 과거 일보도 서로 섞이지 않아야 한다.","actual":"서버는 선택 날짜의 저장된 일보 행만 반환하며 직원 번호와 날짜 조합을 한 건으로 제한한다. 목록은 공정 부서 순서, 직원 표시 순서, 이름 순으로 정렬한다. 과거에 저장된 일보는 직원이 사용 중지돼도 일보 행 자체가 남아 조회된다.\n\n보완 브라우저 실측: Codex 인앱 브라우저에서 2026-09-18 일보의 빈 저장 거부, 1자 저장, 5,001자 거부, 최종 내용 수정 저장, 빠른 이중 클릭 뒤 작성자 1명·1건 유지까지 확인했다. 2026-09-17 전체 일보에서는 11명 목록과 타 직원 김지현의 읽기 전용 상세를 확인했고, 같은 화면의 MES 작업 기록에서 창고 8건·6EA와 불량 2건·2EA를 펼칠 수 있었다.","verdict":"PASS","note":""},{"id":"8.20-05","category":"일일보고","action":"전체 일보 열람","expected":"내 일보만 편집할 수 있고 다른 직원의 일보는 읽기 전용이어야 한다. 화면을 우회해 다른 직원 번호로 저장을 요청해도 서버가 거부해야 한다.","actual":"화면은 선택한 직원이 로그인한 본인일 때만 편집기를 보여 주고 다른 직원은 읽기 전용으로 표시한다. 서버도 주소의 직원 번호와 요청 본문의 작성자 번호가 다르면 403으로 거부하며, 사용 중지 직원의 저장도 403으로 막는다.\n\n보완 브라우저 실측: Codex 인앱 브라우저에서 2026-09-18 일보의 빈 저장 거부, 1자 저장, 5,001자 거부, 최종 내용 수정 저장, 빠른 이중 클릭 뒤 작성자 1명·1건 유지까지 확인했다. 2026-09-17 전체 일보에서는 11명 목록과 타 직원 김지현의 읽기 전용 상세를 확인했고, 같은 화면의 MES 작업 기록에서 창고 8건·6EA와 불량 2건·2EA를 펼칠 수 있었다.","verdict":"PASS","note":""},{"id":"8.20-06","category":"일일보고","action":"MES 거래 요약","expected":"일일보고의 작업 수는 화면 뒤의 기록 줄 수가 아니라 직원이 실제로 처리한 작업 묶음 수로 보여야 하며, 수량도 단위별로 헷갈리지 않게 나뉘어야 한다.","actual":"화면에 보이는 거래 묶음별로 작업 1건을 세고, 묶음 안의 유효한 품목 수량은 EA 같은 단위별로 따로 더한다. 취소된 줄만 있는 묶음은 완료 작업 수와 수량에서 제외된다. 실제 화면에서 단일 생산 입고가 공정 1건·1EA로 표시됐고, 자동 테스트에서는 한 작업의 여러 원장 줄과 취소 줄을 구분해 계산했다.","verdict":"PASS","note":""},{"id":"8.20-07","category":"일일보고","action":"취소 거래의 요약","expected":"완료 작업과 취소 작업을 따로 알아볼 수 있어야 하고, 표시된 수량이 취소 전 총처리량인지 취소를 반영한 순수량인지 화면에서 명확해야 한다.","actual":"화면 위쪽 요약은 취소된 줄을 빼고 완료된 작업의 건수와 수량만 보여 주며, 옆에는 `취소 N건`만 따로 표시한다. 취소된 수량이 몇 개인지, 완료 수량이 취소 전 총량인지 취소 후 순량인지 설명하는 문구는 없다. 직원은 같은 날 취소가 있으면 숫자의 기준을 화면만 보고 확실히 알기 어렵다.\n\n보완 브라우저 실측: Codex 인앱 브라우저에서 2026-09-18 일보의 빈 저장 거부, 1자 저장, 5,001자 거부, 최종 내용 수정 저장, 빠른 이중 클릭 뒤 작성자 1명·1건 유지까지 확인했다. 2026-09-17 전체 일보에서는 11명 목록과 타 직원 김지현의 읽기 전용 상세를 확인했고, 같은 화면의 MES 작업 기록에서 창고 8건·6EA와 불량 2건·2EA를 펼칠 수 있었다.","verdict":"DIFFERENCE","note":"P2 · 취소 건수만 제공하고 취소 수량과 총량·순량 기준을 설명하지 않는다."},{"id":"8.20-08","category":"일일보고","action":"취소 거래 상세","expected":"취소된 원자재 입고나 AS 사용출고는 원래 완료 작업처럼 보이면 안 된다. `입고 취소`·`사용출고 취소`라고 표시하고 재고가 실제로 돌아간 반대 방향, 취소자·사유·시각, 원래 작업 연결을 보여야 한다.","actual":"입출고 내역 화면이 사용하는 공통 변환기는 원래 작업과 취소 작업을 함께 받으면 취소 종류·실제 반대 방향·취소 정보를 만들 수 있다. 그러나 일일보고 API는 거래 줄만 넘기고 원래 작업과 취소 작업 정보를 전달하지 않는다. 그래서 새 취소 원장에서는 취소 상태와 방향 정보가 비거나 원래 완료 작업처럼 표시될 수 있다.\n\n보완 브라우저 실측: Codex 인앱 브라우저에서 2026-09-18 일보의 빈 저장 거부, 1자 저장, 5,001자 거부, 최종 내용 수정 저장, 빠른 이중 클릭 뒤 작성자 1명·1건 유지까지 확인했다. 2026-09-17 전체 일보에서는 11명 목록과 타 직원 김지현의 읽기 전용 상세를 확인했고, 같은 화면의 MES 작업 기록에서 창고 8건·6EA와 불량 2건·2EA를 펼칠 수 있었다.","verdict":"DIFFERENCE","note":"P1 · 일일보고 상세이 취소 원장의 정·역작업 메타데이터를 받지 않아 유형과 방향을 정확히 설명하지 못한다."},{"id":"8.20-09","category":"일일보고","action":"거래 상세 펼치기","expected":"일일보고에서 작업 상세를 펼치고 닫을 때 화면이 깨지거나 빨간 오류 화면이 뜨지 않아야 하며, 상세 내용과 스크롤만 자연스럽게 바뀌어야 한다.","actual":"공정 작업을 펼치자 텅스텐 필라멘트, 요청자 김현우, 튜브 재고 1개 증가가 정상적으로 보였다. 상세를 여는 동안 화면 오류나 브라우저 오류가 발생하지 않았다.","verdict":"PASS","note":""},{"id":"8.20-10","category":"일일보고","action":"상세 펼침 오류의 코드 원인","expected":"거래 상세를 펼칠 때 자식 화면의 상태를 계산하는 도중 부모 화면 상태를 바꾸지 않아야 하며, 빠르게 펼치고 닫아도 React 경고나 오류 화면이 없어야 한다.","actual":"상세 버튼 처리는 먼저 열릴 작업 종류를 계산하고 자식의 열린 상태를 갱신한 뒤 부모에게 별도로 알리는 순서로 구현돼 있다. React StrictMode에서 펼치기·닫기·다른 종류 전환을 실행하는 자동 테스트가 통과했고, 실제 인앱 브라우저에서도 오류 화면이나 콘솔 오류 없이 상세가 열렸다.","verdict":"PASS","note":""},{"id":"8.20-11","category":"일일보고","action":"취소 표시 오류의 데이터 원인","expected":"같은 거래를 일일보고와 입출고 내역에서 열었을 때 작업 종류, 완료·취소 상태, 이동 방향이 같아야 한다. 한쪽만 취소 사실을 알고 다른 쪽은 완료로 보이면 안 된다.","actual":"입출고 내역은 원래 작업과 취소 작업을 함께 조회해 취소 상태와 역방향을 계산한다. 일일보고는 그 작업 정보를 불러오지 않고 거래 줄의 예전 취소 표시만 사용한다. 따라서 새 취소 방식으로 처리된 같은 거래는 입출고 내역에서는 취소로 보이지만 일일보고에서는 완료처럼 보일 수 있어 두 화면이 같은 기준을 사용하지 않는다.\n\n보완 브라우저 실측: Codex 인앱 브라우저에서 2026-09-18 일보의 빈 저장 거부, 1자 저장, 5,001자 거부, 최종 내용 수정 저장, 빠른 이중 클릭 뒤 작성자 1명·1건 유지까지 확인했다. 2026-09-17 전체 일보에서는 11명 목록과 타 직원 김지현의 읽기 전용 상세를 확인했고, 같은 화면의 MES 작업 기록에서 창고 8건·6EA와 불량 2건·2EA를 펼칠 수 있었다.","verdict":"DIFFERENCE","note":"P1 · 동일 취소 거래의 입출고 내역과 일일보고 표현이 달라질 수 있다."},{"id":"8.20-12","category":"일일보고","action":"일보와 거래의 독립성","expected":"직원이 보고서 글을 아직 작성하지 않았더라도 당일 실제로 처리된 MES 작업은 별도로 보여야 한다. 보고서 작성 여부와 MES 작업 유무를 같은 뜻처럼 표시하면 안 된다.","actual":"일보 본문이 한 글자도 저장되지 않은 상태였지만, 당일 승인한 공정 작업 1건과 수량 1개는 별도 영역에 정상 표시됐다.","verdict":"PASS","note":""},{"id":"8.21-01","category":"주간보고","action":"주차 경계","expected":"주간보고 화면, 내려받은 보고서, 서버 계산이 모두 같은 주간 시작일과 종료일을 사용해야 하며 다른 주의 작업이 섞이면 안 된다.","actual":"ChatGPT 인앱 브라우저 화면은 현재 주차를 2026년 9월 14일부터 20일까지로 표시했고, 같은 조건의 서버 응답도 정확히 그 날짜를 사용했다. 내려받은 F705 생산일지에서 9월 14일부터 20일까지의 날짜 칸만 다시 더한 결과도 화면의 모델별 생산 151개와 같았다. 앞뒤 날짜의 작업이 이번 주 합계에 섞이지 않았다.","verdict":"PASS","note":""},{"id":"8.21-02","category":"주간보고","action":"공정별 현재 재고","expected":"공정 카드의 현재 재고는 그 공정 아래 품목들의 현재 정상재고를 모두 더한 값과 같아야 한다. 같은 품목을 빠뜨리거나 다른 공정 품목을 섞으면 안 된다.","actual":"2026년 9월 14~20일 주간보고의 여섯 공정을 모두 펼쳐 확인했다. 튜브 2개, 고압 12개, 진공 22개, 튜닝 11개, 조립 47개, 출하 45개 품목이 표시됐고, 각 품목의 전주·현재·생산·입고·출고·불량 합계가 해당 공정 카드 숫자와 모두 일치했다. 현재 정상재고는 튜브 0, 고압 315, 진공 503, 튜닝 510, 조립 212, 출하 103으로 화면과 서버가 같았다.","verdict":"PASS","note":""},{"id":"8.21-03","category":"주간보고","action":"공정별 증감","expected":"생산·입고·출고·불량 거래는 정해진 열 한 곳에만 들어가야 하고, 전주 재고에 증가를 더하고 감소를 빼면 현재 재고가 되어야 한다.","actual":"이번 주에 주간보고가 사용한 활동 원장 39건을 확인했다. 39건의 원장 번호는 모두 달라 같은 거래가 두 열에 중복되지 않았다. 생산 13건 168개, 입고 2건 11개, 출고 20건 207개, 불량 4건 6개였고 화면·API 합계와 같았다. 여섯 공정 모두 `전주 + 생산 + 입고 - 출고 - 불량 = 현재`가 맞았다.\n\n보완 브라우저 실측: Codex 인앱 브라우저의 주간보고에서 선택 주·공정·모델 표, 생산·입고·출고·불량 열과 검산 문구를 직접 대조했고, 관리자 내보내기에서 2026년 F704-02·F705-02 연도와 다운로드 동작을 눌러 확인했다.","verdict":"PASS","note":""},{"id":"8.21-04","category":"주간보고","action":"품목 상세","expected":"공정 카드를 눌러 본 품목별 숫자를 모두 더하면 카드 숫자와 같아야 하며, 품목 행의 활동 원장과 현재 위치 재고가 서로 다른 숫자를 보여서는 안 된다.","actual":"인앱 브라우저에서 여섯 공정 카드를 하나씩 눌렀을 때 제목과 상세 목록이 선택한 공정으로 즉시 바뀌었다. 화면의 상세 행 수와 서버 item_count가 모두 같았고, 품목 행 합계도 카드의 전주·생산·입고·출고·불량·현재 값과 전부 일치했다.","verdict":"PASS","note":""},{"id":"8.21-05","category":"주간보고","action":"생산 현황 상단","expected":"공정 생산이 실제로 있으면 화면이 `생산 실적 없음`이라고 잘못 안내하면 안 된다. 모델별 집계가 따로 0일 때만 그 사실을 별도로 알려야 한다.","actual":"현재 주차의 공정 생산 합계는 168개이고 모델별 매트릭스 합계는 151개였다. 화면은 DX3000 20, COCOON 86, SOLO 45를 모델별 표에 표시했고 `생산 실적 없음`이라는 잘못된 안내는 나오지 않았다. 모델별 표와 공정별 변화는 서로 다른 영역으로 유지됐다.","verdict":"PASS","note":"공정 합계와 모델별 합계가 서로 다른 실제 데이터에서도 화면이 두 영역을 혼동하지 않았다. 공정 생산\u003e0·모델 매트릭스=0 조합은 현재 실데이터에 없어 자동 fixture로 계속 보장해야 한다."},{"id":"8.21-06","category":"주간보고","action":"API 생산 합계와 매트릭스","expected":"공정 생산 합계와 모델별 생산 표는 계산 범위가 다르므로 서로 다른 값이어도 오류가 아니다. 화면과 서버는 둘을 별도 값으로 전달하고 같은 합계라고 오해시키지 않아야 한다.","actual":"실제 이번 주에는 공정 생산이 168개, 모델별 표 합계가 151개로 17개 차이 났다. 서버 응답은 summary.total_produce_qty와 production_matrix를 별도 필드로 주었고, 화면도 `생산 현황` 표와 `공정별 변화` 카드로 나눠 표시했다. 두 숫자가 같다고 합쳐 보여 주는 표시는 없었다.","verdict":"PASS","note":""},{"id":"8.21-07","category":"주간보고","action":"검산 상태","expected":"검산 완료 표시는 품목·공정·전체 재고 산식이 맞다는 뜻으로만 사용해야 한다. 계산 범위가 다른 모델별 생산표까지 공정 합계와 같다고 오해시키면 안 된다.","actual":"서버 검산 결과는 verified였고 실패 목록은 비어 있었다. 실제로 모든 품목·공정의 두 재고 산식이 맞았다. 검산 문구는 품목·공정·전체 합계를 가리켰고, 모델별 매트릭스는 별도 필드로 남아 168과 151의 차이를 오류로 처리하지 않 xpected":"취소 집계 정책은 카드·필터·원장 전체에서 일관되게 설명되어야 합니다.","actual":"취소도 같은 부서 작업으로 집계되며, 수량조정에는 섞이지 않아 목록과 카드의 분류 기준이 같습니다.\n\n보완 브라우저 실측: 부서 생산 입고에서 기본 BOM·커스텀 BOM의 상위\/하위 반영 설명과 포함·제외 행, 위치별 예상 전후값을 확인했다. 비결재권자 요청은 승인 대기 한 건만 생성되고 정상 4·불량 26이 유지됐으며 내 요청의 수정·취소 화면과 예약 표시를 확인한 뒤 취소했다. 기존 승인 완료 행과 취소 상세에서는 요청자·승인자·취소자와 정·역 재고 효과를 대조했다.","verdict":"PASS","note":""},{"id":"8.24-01","category":"입출고","action":"목적 부서 결정","expected":"직원이 품목을 고르면 시스템이 품목의 공정에 맞는 목적 부서를 자동으로 정해야 한다. 서로 다른 공정 품목을 한 요청에 함께 담아도 각 품목의 목적지가 섞이거나 하나로 덮어써지면 안 된다.","actual":"현재 창고 재고가 있는 6개 공정 코드를 한 요청에 함께 담았다. HR 품목은 고압, VR 품목은 진공, AA·AR 품목은 조립, NR 품목은 튜닝, PR 품목은 출하로 각각 자동 배정됐다. 화면은 상단 경로를 `창고 → 여러 부서`로 표시하면서도 최종 확인에서는 여섯 품목의 개별 목적지를 그대로 보존했다. 다만 현재 DB에는 창고 재고가 있는 미매핑 품목이 없어 미매핑 거부 경계는 이 화면에서 실행하지 못했다.","verdict":"PASS","note":"실데이터의 여섯 공정 독립 배정과 격리 테스트의 미매핑 거부가 모두 계약과 일치했다."},{"id":"8.24-02","category":"입출고","action":"요청 수량","expected":"이동 수량은 1개 이상의 정수여야 하고 실제로 사용할 수 있는 창고 재고를 넘으면 안 된다. 여러 품목 중 하나만 잘못돼도 전체 요청을 제출하지 못하게 해야 한다.","actual":"창고 재고가 1개인 품목에서 수량 1은 `가능 재고 1, 실행 후 0`으로 통과했다. 0으로 줄이면 품목이 작업에서 제외되고 제출 버튼이 꺼졌고, 음수를 직접 입력해도 0 아래로 내려가지 않았다. 소수 입력은 받아들이지 않았으며 10개나 11개로 올리면 `재고 부족`이 표시되고 제출이 막혔다. 다른 다섯 품목이 모두 정상이어도 이 한 품목만 부족하게 만들자 전체 제출 버튼이 비활성화됐다.","verdict":"PASS","note":""},{"id":"8.24-03","category":"입출고","action":"최종 확인 결재 상태","expected":"창고 결재 역할이 없는 직원이 창고 자재 이동을 제출하면 즉시 재고를 움직이지 않고 `창고 승인 대기` 요청으로 만들어야 한다.","actual":"E33의 최종 확인 화면은 `창고 결재 필요`, `창고 결재 요청 1건`으로 안내했다. 제출 뒤 요청은 승인 대기로 저장됐고 창고 실재고 17개와 목적지 실재고는 바뀌지 않았다.","verdict":"PASS","note":""},{"id":"8.24-04","category":"입출고","action":"최종 확인 작업 표현","expected":"낱개로 고른 품목은 최종 확인에서도 `낱개`라고 표시해야 한다. BOM 작업이 아닌데 BOM이라고 안내하면 안 된다.","actual":"한 품목 확인 화면은 `창고 → 부서 · 낱개 · 반영 1건`, 여섯 품목 확인 화면은 `창고 → 부서 · 낱개 · 반영 6건`으로 표시됐다. 두 경우 모두 BOM 문구가 나타나지 않았고 실제 선택 방식과 건수가 맞았다.","verdict":"PASS","note":""},{"id":"8.24-05","category":"입출고","action":"요청 생성","expected":"제출 한 번에 승인 대기 요청은 정확히 한 건만 생겨야 하며, 승인 전에는 완료 거래나 입출고 원장을 만들면 안 된다.","actual":"제출 뒤 요청 코드 `SR-20260917-094404-EB39B8AF` 한 건과 요청선 한 건이 생성됐다. 승인 전에는 요청만 대기하고 물리 재고가 움직이지 않았으며, 완료 원장은 승인 시각에 한 건 생성됐다.\n\n보완 브라우저 실측: 요청 제출 성공창과 내 요청 목록에서 승인 대기 요청이 정확히 한 건 생성된 것을 확인했다. 완료 내역과 실제 재고는 생성·변경되지 않았으며 검수 후 요청을 취소했다.","verdict":"PASS","note":""},{"id":"8.24-06","category":"입출고","action":"요청자 내 요청","expected":"요청자는 `내 요청`에서 자신이 보낸 작업의 경로, 품목, 수량, 메모와 현재 상태를 확인할 수 있어야 한다. 승인되면 누가 승인했는지까지 표시되고, 대기 요청이 완료 요청으로 정확히 바뀌어야 한다.","actual":"E33에게 온 `결재 승인됨` 알림을 누르자 입출고의 `내 요청`으로 바로 이동했다. 맨 위 요청은 `창고 → 부서`, `창고 → 튜브`, 1건, 완료로 표시됐고 품목명·코드·이동 1개·검수 메모가 그대로 남았다. 창고 승인 상태는 `승인`이고 승인자 E32도 함께 표시됐다.\n\n보완 브라우저 실측: 부서 생산 입고에서 기본 BOM·커스텀 BOM의 상위\/하위 반영 설명과 포함·제외 행, 위치별 예상 전후값을 확인했다. 비결재권자 요청은 승인 대기 한 건만 생성되고 정상 4·불량 26이 유지됐으며 내 요청의 수정·취소 화면과 예약 표시를 확인한 뒤 취소했다. 기존 승인 완료 행과 취소 상세에서는 요청자·승인자·취소자와 정·역 재고 효과를 대조했다.","verdict":"PASS","note":""},{"id":"8.24-07","category":"입출고","action":"승인 전 물리·예약 재고","expected":"승인 전에는 창고와 목적 부서의 실제 수량을 그대로 두되, 같은 창고 재고가 다른 요청에 중복 사용되지 않도록 출발 위치에 요청 수량만 예약해야 한다.","actual":"요청 전후 창고 실재고는 17개로 같았고 전체 실재고도 19개로 유지됐다. 대신 예약 수량만 0개에서 1개로 늘었다. 역할을 회수해 승인을 거부한 동안에도 이 값들이 그대로 보존됐다.\n\n보완 브라우저 실측: 부서 생산 입고에서 기본 BOM·커스텀 BOM의 상위\/하위 반영 설명과 포함·제외 행, 위치별 예상 전후값을 확인했다. 비결재권자 요청은 승인 대기 한 건만 생성되고 정상 4·불량 26이 유지됐으며 내 요청의 수정·취소 화면과 예약 표시를 확인한 뒤 취소했다. 기존 승인 완료 행과 취소 상세에서는 요청자·승인자·취소자와 정·역 재고 효과를 대조했다.","verdict":"PASS","note":""},{"id":"8.24-08","category":"입출고","action":"결재자 알림","expected":"새 창고 승인 요청은 현재 유효한 창고 결재자에게 요청자, 이동 경로, 품목, 수량을 알아볼 수 있는 알림으로 한 번씩 전달돼야 한다.","actual":"활성 창고 결재자 네 명에게 각각 결재 알림 한 건이 생성됐다. E32가 로그인하자 `QA-PC-AUDIT-HV-151013 · 창고 → 부서 · QA-PC-AUDIT-DEFECT-151013 · 총 1개`가 표시돼 누가 무엇을 요청했는지 바로 확인할 수 있었다.","verdict":"PASS","note":""},{"id":"8.24-09","category":"입출고","action":"승인함 분리","expected":"창고 승인이 필요한 요청은 창고 승인함에만 나타나고, 부서 승인함이나 AS·연구 승인함에 잘못 나타나면 안 된다.","actual":"E32의 창고 승인함에만 배지 1과 해당 요청이 표시됐다. 요청에는 창고 승인만 필요하다고 저장됐고 부서 승인 플래그는 꺼져 있었다.","verdict":"PASS","note":""},{"id":"8.24-10","category":"입출고","action":"승인 확인","expected":"현재 창고 결재 역할과 올바른 PIN을 가진 직원만 요청을 승인할 수 있어야 한다. 이미 끝난 요청을 다시 승인해도 재고나 원장이 한 번 더 생기면 안 된다.","actual":"역할을 회수한 E32의 승인은 서버가 403으로 막았고 요청·재고·예약이 그대로였다. 역할을 복원한 뒤 화면 승인은 한 번 성공했다. 완료된 요청에 같은 승인 요청을 다시 보내자 서버는 완료된 결과를 그대로 돌려줬으며 재고와 원장 건수는 변하지 않았다.\n\n보완 브라우저 실측: 부서 생산 입고에서 기본 BOM·커스텀 BOM의 상위\/하위 반영 설명과 포함·제외 행, 위치별 예상 전후값을 확인했다. 비결재권자 요청은 승인 대기 한 건만 생성되고 정상 4·불량 26이 유지됐으며 내 요청의 수정·취소 화면과 예약 표시를 확인한 뒤 취소했다. 기존 승인 완료 행과 취소 상세에서는 요청자·승인자·취소자와 정·역 재고 효과를 대조했다.","verdict":"PASS","note":""},{"id":"8.24-11","category":"입출고","action":"승인 후 물리 재고","expected":"승인이 끝나면 창고에서 정확히 1개를 빼고 해당 품목의 목적 부서 정상 재고에 정확히 1개를 더한 뒤 예약을 해제해야 한다. 일부만 반영돼서는 안 된다.","actual":"승인 직후 요청과 요청선이 모두 완료로 바뀌었다. 창고는 17개에서 16개로 줄고 실제 튜브 정상 위치는 0개에서 1개로 늘었으며 예약은 1개에서 0개가 됐다. 전체 수량은 19개로 유지돼 이동 중 유실이나 중복 증가가 없었다.","verdict":"PASS","note":""},{"id":"8.24-12","category":"입출고","action":"내역 목록","expected":"입출고 내역 목록에는 요청자와 승인자를 구분하고, 실제로 움직인 각 위치의 작업 전·후 수량을 그대로 표시해야 한다. 다른 부서에 따로 존재하는 재고를 목적 위치 수량에 합쳐 보여주면 안 된다.","actual":"목록은 요청자 E33과 승인자 E32를 구분했고 창고 17→16도 정확했다. 그러나 실제 튜브 위치는 0→1인데 목록은 별도로 남아 있던 `창고` 부서 정상 재고 2개까지 합쳐 `튜브 2→3`으로 표시했다. 취소 내역에서도 실제 튜브는 1→0인데 화면은 `튜브 3→2`로 표시해 같은 문제가 반대 방향으로 반복됐다. 직원은 튜브의 작업 전·후 재고를 잘못 이해할 수 있다.","verdict":"DIFFERENCE","note":"P1 · 목록이 생산 위치 전체 합계를 목적 부서 수량처럼 표시해 위치별 재고 추적 요구를 충족하지 못한다."},{"id":"8.24-13","category":"입출고","action":"내역 상세","expected":"입출고 상세에서도 누가 요청하고 누가 승인했는지, 각 시각과 이동 경로, 메모를 서로 구분해 확인할 수 있어야 한다.","actual":"상세 패널은 요청자 E33과 요청 시각, 승인자 E32와 승인 시각을 별도 줄로 보여줬고 `창고 → 튜브` 경로와 검수 메모도 표시했다. 요청자와 승인자를 한 사람처럼 합치지 않았다.","verdict":"PASS","note":""},{"id":"8.24-14","category":"입출고","action":"승인 후 월 집계","expected":"창고 이동을 승인하면 이번달 전체 처리 건수와 창고 처리 건수만 1건 늘어야 한다. 부서 입출고나 수량조정으로 잘못 집계되면 안 된다.","actual":"승인 전후를 비교하니 이번달 전체는 415건에서 416건, 창고는 154건에서 155건으로 각각 1건 늘었다. 부서는 132건, 수량조정은 83건으로 그대로여서 작업 종류별 집계가 섞이지 않았다.","verdict":"PASS","note":""},{"id":"8.24-15","category":"입출고","action":"승인 거래 취소","expected":"취소 권한이 있는 직원이 PIN과 취소 사유를 입력하면 완료 거래의 반대 거래가 한 번만 만들어져 재고가 원래대로 돌아가야 한다. 원래 거래는 지우지 말고 누가 취소했는지와 사유를 별도로 남겨야 하며, 같은 거래를 두 번 취소할 수 없어야 한다.","actual":"관리자가 내역 상세에서 PIN과 취소 사유를 입력하자 원래 거래는 `취소됨`으로 남고 반대 거래가 새로 생성됐다. 반대 거래에는 관리자 E31과 취소 사유, 원래 작업·원장 연결이 보존됐다. 같은 거래의 취소 가능 여부를 다시 확인하니 `이미 취소된 작업`으로 차단됐고, 강제로 한 번 더 요청해도 422 오류로 거절돼 재고와 원장이 더 바뀌지 않았다.","verdict":"PASS","note":""},{"id":"8.24-16","category":"입출고","action":"취소 후 물리·월 집계","expected":"완료된 창고 이동을 취소하면 창고와 실제 목적 부서 재고, 예약 수량이 작업 전 상태로 정확히 돌아가야 한다. 이번달 요약은 취소 내역을 새 작업 1건으로 세되 부서·수량조정 집계를 건드리면 안 된다.","actual":"취소 뒤 전체 재고는 19개로 유지됐고 창고는 16개에서 17개, 실제 튜브 정상 재고는 1개에서 0개로 돌아갔다. 예약은 0개였으며 별도로 존재하던 `창고` 부서 재고 2개도 바뀌지 않았다. 이번달 전체와 창고는 각각 1건 늘고 부서·수량조정은 그대로여서 실제 재고와 월간 집계의 순효과가 맞았다.","verdict":"PASS","note":""},{"id":"8.25-01","category":"입출고","action":"시작 재고","expected":"품목을 고르기 전과 장바구니에 담아 확인하는 동안에는 실제 재고가 바뀌면 안 된다. 최종 제출을 눌렀을 때만 재고가 움직여야 한다.","actual":"검수 품목 `3216 B 100nF`를 선택하기 전 전체 재고는 1,138개, 창고는 1개, 고압 정상 재고는 1,137개, 예약은 0개였다. 품목 선택과 수량 확인 단계까지 이 값들이 그대로였고 최종 제출 뒤에만 이동했다.","verdict":"PASS","note":""},{"id":"8.25-02","category":"입출고","action":"자동 목적지","expected":"직원이 부서를 따로 고르지 않아도 품목의 공정 정보에 맞는 목적 부서가 자동으로 정해져야 한다.","actual":"`3216 B 100nF`를 고르자 화면이 이동 경로를 `창고 → 고압`으로 자동 결정했다. 별도의 부서 선택 입력은 나타나지 않았고 실제 반영 위치도 고압이었다.","verdict":"PASS","note":""},{"id":"8.25-03","category":"입출고","action":"수량 미리보기","expected":"요청 수량을 입력하면 지금 사용할 수 있는 창고 재고와 작업 후 남을 수량을 바로 보여줘야 한다. 가능한 수량일 때만 다음 단계로 넘어가야 한다.","actual":"수량 1개를 입력하자 `가능 재고 1`, `실행 후 0`이 표시됐고 다음 단계로 진행할 수 있었다. 표시값은 실제 제출 후 창고 1→0과 같았다.","verdict":"PASS","note":""},{"id":"8.25-04","category":"입출고","action":"최종 확인 결재 표현","expected":"직접 승인할 권한이 있는 직원에게는 승인 요청을 보낸다고 안내하지 말고, 제출 즉시 자동 승인되어 재고에 반영된다고 분명히 알려야 한다.","actual":"최종 확인 화면의 주 안내와 제출 버튼이 모두 `자동 승인 후 즉시 반영`으로 표시됐다. 확인창도 `제출 즉시 승인되어 재고에 반영됩니다`라고 안내해 실제 처리 방식과 문구가 일치했다.","verdict":"PASS","note":""},{"id":"8.25-05","category":"입출고","action":"최종 확인 작업 방식","expected":"완제품 묶음이 아니라 한 품목만 옮기는 작업이면 `낱개`라고 표시해야 한다. 직원이 BOM 작업으로 오해할 문구가 나오면 안 된다.","actual":"최종 확인 화면과 확인창 모두 작업을 `창고 → 부서 · 낱개 · 반영 1건`으로 표시했다. 선택한 한 품목과 수량 1개만 보였고 BOM이라는 말은 나타나지 않았다.","verdict":"PASS","note":""},{"id":"8.25-06","category":"입출고","action":"실제 자가승인","expected":"결재권자가 제출하면 대기 요청을 만들지 않고 한 번만 자동 승인해 창고 1개를 빼고 목적 부서에 1개를 더해야 한다. 전체 수량은 변하지 않아야 한다.","actual":"제출 즉시 요청은 완료 상태가 됐고 창고는 1→0, 고압은 1,137→1,138로 바뀌었다. 전체는 1,138개, 예약은 0개로 유지됐고 요청자와 승인자는 모두 유승범으로 저장됐다.","verdict":"PASS","note":""},{"id":"8.25-07","category":"입출고","action":"승인함","expected":"필요한 결재를 본인이 자동 승인했다면 승인 대기 목록이나 숨은 대기 요청이 남아서는 안 된다.","actual":"제출 직후 화면은 대기 상태가 아닌 완료 상태를 보여줬다. DB에서도 요청은 처음부터 COMPLETED이고 승인자와 승인 시각이 채워졌으며 예약 수량은 0이라 별도의 창고·부서 승인 대기 단계가 남지 않았다.","verdict":"PASS","note":""},{"id":"8.25-08","category":"입출고","action":"완료창","expected":"작업이 실제로 끝났다면 완료창도 승인 요청을 보냈다고 하지 말고, 자동 승인되어 재고 반영까지 끝났다고 한 가지 의미로 알려야 한다.","actual":"완료창 제목은 `입출고 반영 완료`, 설명은 `자동 승인되어 입출고가 반영되었습니다`로 표시됐다. 대기 요청처럼 보이는 문구가 섞이지 않았다.","verdict":"PASS","note":""},{"id":"8.25-09","category":"입출고","action":"정거래 목록","expected":"입출고 내역에는 누가 처리했는지, 어느 위치에서 어느 위치로 몇 개가 움직였는지, 작업 전후 수량과 메모를 직원이 바로 확인할 수 있어야 한다.","actual":"최신 내역은 `창고 입출고`, 담당자 유승범, 메모 표시와 함께 `창고 1 −1→0, 고압 1,137 +1→1,138`을 보여줬다. 상세에도 `창고 → 고압`, 처리자, 처리 시각, 검수 메모가 같은 내용으로 표시됐다.","verdict":"PASS","note":""},{"id":"8.25-10","category":"입출고","action":"월 집계","expected":"창고에서 부서로 한 번 이동했으므로 이번달 전체 처리 건수와 창고 처리 건수만 각각 1건 늘어야 한다. 부서 작업이나 수량조정으로 잘못 세면 안 된다.","actual":"자가승인 이동을 반영한 직후 이번달 요약은 전체 416건, 창고 123건, 부서 220건, 수량조정 27건이었다. 통제 거래 직전 값과 비교하면 전체와 창고만 각각 1건 늘고 부서와 수량조정은 그대로였다.","verdict":"PASS","note":""},{"id":"8.25-11","category":"입출고","action":"취소","expected":"완료 거래를 취소하면 원래 내역은 지우지 않고 취소됨으로 남겨야 한다. 반대 재고 거래는 정확히 한 번만 만들고, 취소 사유와 원거래 연결을 보존하며 두 번 취소하지 못하게 해야 한다.","actual":"상세에서 취소 사유와 승인 정보를 입력하자 원거래는 `취소됨`으로 남고 사유가 상세에 표시됐다. DB에는 원거래를 가리키는 취소 operation과 역원장이 각각 1건만 생겼다. 취소 후에는 `이 내역 취소` 버튼이 사라져 같은 내역을 다시 취소할 수 없었다.","verdict":"PASS","note":""},{"id":"8.25-12","category":"입출고","action":"취소 후 재고·집계","expected":"취소가 끝나면 창고와 목적 부서 재고가 작업 전 상태로 정확히 돌아와야 한다. 전체 재고와 예약은 변하지 않아야 하며, 이번달 집계는 정거래와 취소를 각각 한 건으로 세되 부서·수량조정 집계를 건드리지 않아야 한다.","actual":"취소 뒤 전체는 1,138개로 유지됐고 창고는 0→1, 고압은 1,138→1,137로 돌아가 작업 전 상태가 완전히 복원됐다. 예약은 0개였다. 이번달 요약은 정거래 직후 416\/123\/220\/27에서 취소 후 417\/124\/220\/27로 바뀌어 전체와 창고만 각각 1건 늘었다.","verdict":"PASS","note":""},{"id":"PC-DELTA-TEST-01","category":"테스트 거버넌스","action":"계약 ID가 표시된 자동 테스트와 assertion을 역추적한다.","expected":"실제 assert로 계약 기대값을 확인한 테스트만 증거로 세고, 단순 fixture의 ID 문자열은 제외해야 합니다.","actual":"현재는 테스트 파일 안에 계약 ID 문자열만 있어도 증거 수에 포함될 수 있습니다.","verdict":"DIFFERENCE","note":"P1 · fixture 문자열이 계약 증거로 잘못 집계될 수 있다."},{"id":"PC-DELTA-TEST-02","category":"테스트 거버넌스","action":"전체 계약 매핑과 부분 계획 매핑을 각각 실행한다.","expected":"전체 완료는 270\/270일 때만 성공으로 표시하고, 부분 계획 수치는 별도 지표로 보여야 합니다.","actual":"완전성 강제는 선택 옵션을 줄 때만 실행되어 기본 검사만으로는 부분 계획을 성공처럼 통과시킬 수 있습니다.","verdict":"DIFFERENCE","note":"P1 · 기본 CI 경로에서 270\/270 완료 조건을 강제해야 한다."},{"id":"PC-DELTA-TEST-03","category":"테스트 거버넌스","action":"업무영역·위험등급·계약 또는 Delta ID로 Playwright를 선택 실행한다.","expected":"smoke·P0·개별 계약 ID 필터가 의도한 테스트만 안정적으로 선택해야 합니다.","actual":"Playwright 테스트에는 계약 ID 태그와 공통 필터 체계가 없어 이 조건을 안정적으로 선택할 수 없습니다.","verdict":"DIFFERENCE","note":"P1 · 공통 태그와 필터 검증을 추가해야 긴급 범위만 재현 가능하다."},{"id":"PC-DELTA-AUTH-01","category":"인증","action":"활성·비활성 직원과 정상·오류 PIN으로 로그인한다.","expected":"로그인 성공 때 현재 작업자와 감사 세션을 저장하고, 직원 없음·비활성·PIN 오류·횟수 제한은 서로 다른 오류로 알려야 합니다.","actual":"로그인 성공 시 작업자와 감사 세션이 저장되고, 없는 직원·비활성·잘못된 PIN·제한 초과를 구분해 안내합니다.\n\n보완 브라우저 실측: Codex 인앱 브라우저에서 유승범을 선택해 잘못된 PIN 제출 시 `PIN 번호가 올바르지 않습니다.`가 표시됐고, 정상 PIN으로 다시 로그인하자 대시보드로 이동했다.","verdict":"PASS","note":"P0"},{"id":"PC-DELTA-AUTH-02","category":"인증","action":"사용자 메뉴에서 로그아웃을 취소한 뒤 다시 확인한다.","expected":"로그아웃 확인창에서 취소를 누르면 지금 사용 중인 계정과 화면이 그대로 유지돼야 한다. 다시 로그아웃을 눌러 확인하면 로그인 정보가 지워지고 다른 직원이 로그인할 수 있는 화면으로 돌아가야 한다.","actual":"첫 번째 로그아웃 확인창에서 취소하자 관리자 계정과 현재 화면이 그대로 유지됐다. 다시 로그아웃을 선택해 확인하자 관리자 세션이 끝나고 직원 선택·로그인 화면으로 돌아갔다.","verdict":"PASS","note":"P1"},{"id":"PC-DELTA-AUTH-03","category":"인증","action":"현재 PIN, 새 PIN, 확인 PIN의 정상·불일치·동일값 조합을 제출한다.","expected":"유효한 PIN 변경만 저장하고, 성공 직후 이전 PIN은 막고 새 PIN만 허용해야 합니다.","actual":"현재 PIN 확인과 새 PIN 검증을 통과한 경우만 변경되며, 변경 후에는 새 PIN으로만 인증됩니다.\n\n보완 브라우저 실측: 설정의 PIN 재설정 창에서 현재 PIN·새 PIN·새 PIN 확인 세 필드와 저장 버튼 활성 조건을 확인했다. PIN 변경 최종 제출은 계획의 사용자 직접 수행 조건에 따라 실행하지 않고 창을 닫았다.","verdict":"PASS","note":"P0"},{"id":"PC-DELTA-ADMINSESSION-01","category":"인증","action":"관리자 잠금을 해제한 뒤 새로고침·새 탭·권한 회수 후 쓰기를 시도한다.","expected":"관리자 PIN은 메모리에만 두고 새로고침·새 탭에서는 사라지며, 권한이 회수되면 기존 헤더도 서버가 바로 거부해야 합니다.","actual":"관리자 PIN 자체는 메모리에만 있지만 서버는 헤더의 공용 관리자 PIN만 확인해 권한 회수와 연결하지 않습니다.\n\n보완 브라우저 실측: 관리자 직접 주소에서 PIN으로 잠금을 해제해 관리자 8개 메뉴를 확인한 뒤 새로고침하자 관리자 PIN 입력 화면으로 다시 잠겼다.","verdict":"DIFFERENCE","note":"P0 · 권한을 회수해도 기존 관리자 PIN 헤더가 즉시 무효화되지 않는다."},{"id":"PC-DELTA-SHELL-01","category":"공통 셸","action":"숨김 탭, 직접 URL, 뒤로가기, 알림 딥링크로 탭을 이동한다.","expected":"접근 가능한 탭만 열고, 숨긴 URL은 첫 가시 탭으로 안전하게 복구하면서 로그인 세션을 유지해야 합니다.","actual":"역할에 맞는 탭만 표시하고 직접 URL·뒤로가기·알림 이동에서 숨긴 탭이면 첫 가시 탭으로 돌립니다.\n\n보완 브라우저 실측: 현재 역할에 없는 창고 승인함 section=queue 직접 주소로 이동했지만 실제 선택 화면은 요청 작성으로 안전 복구됐고 로그인 세션은 유지됐다.","verdict":"PASS","note":"P0"},{"id":"PC-DELTA-SHELL-02","category":"공통 셸","action":"입출고·출하·일보 편집 중 탭 이동, 같은 탭 재클릭, 브라우저 뒤로가기를 수행한다.","expected":"품목과 수량을 입력한 뒤 다른 메뉴로 이동하거나 브라우저 뒤로가기를 누르면, 저장하지 않은 작업을 계속할지 버릴지 먼저 물어야 한다. ‘계속 작성’을 누르면 품목과 수량이 그대로 남아야 한다. 현재 보고 있는 입출고 메뉴를 다시 누른 것만으로는 이탈 확인창이 뜨거나 입력이 초기화되면 안 된다.","actual":"8-TR-0002 부서 입고 수량 1을 입력한 뒤 대시보드를 누르자 ‘이 화면에서 나갈까요?’ 확인창이 나왔고, ‘계속 작성’을 누르면 같은 4단계 화면에서 품목과 수량 1이 유지됐다. 하지만 현재 보고 있던 입출고 메뉴를 다시 눌러도 같은 확인창이 불필요하게 나타났다. 더 큰 문제는 브라우저 뒤로가기를 누르면 확인창 없이 3단계로 이동하면서 입력한 품목과 수량이 사라졌다는 점이다.","verdict":"DIFFERENCE","note":"P1. 브라우저 뒤로가기에서 미저장 입력이 경고 없이 사라지며, 같은 탭 재클릭에는 불필요한 경고가 뜬다."},{"id":"PC-DELTA-SHELL-03","category":"공통 셸","action":"깨끗한 화면과 미저장 화면에서 상단 동기화를 실행한다.","expected":"아무것도 입력하지 않은 화면에서 동기화 버튼을 누르면 최신 자료를 바로 다시 불러오면 된다. 반면 품목이나 수량을 고른 뒤 아직 저장하지 않은 화면에서는, 입력을 지울지 계속 작성할지 먼저 물어야 한다. 직원이 확인하지 않았는데 작성 중인 내용이 사라지면 안 된다.","actual":"깨끗한 대시보드에서 동기화했을 때는 재고 자료가 정상적으로 다시 조회됐고 전체 921개가 그대로 표시됐다. 그러나 부서 생산 입고에서 텅스텐 필라멘트 1개를 선택한 뒤 상단 동기화를 누르자 확인창이 전혀 나오지 않았다. 화면이 즉시 요청 작성 첫 단계로 돌아가면서 선택한 품목과 작업 방향이 모두 사라졌다.","verdict":"DIFFERENCE","note":"P1 · 상단 동기화가 미저장 입출고 작성을 경고 없이 지운다. 기존 PC-DELTA-SHELL-02의 브라우저 뒤로가기 입력 소실과 같은 계열의 이탈 보호 결함이다."},{"id":"PC-DELTA-SETTINGS-01","category":"설정","action":"테마와 사이드바 방식을 함께 저장하고 한 endpoint만 실패시킨다.","expected":"화면 설정에서 취소를 누르면 방금 고른 값이 적용되지 않아야 한다. 저장하면 테마와 사이드바 방식이 함께 저장되고, 둘 중 하나가 실패할 때는 일부만 바뀐 것처럼 보이지 않아야 한다.","actual":"다크 테마와 펼침 고정을 고른 뒤 취소하자 원래의 라이트 테마와 자동 펼침이 유지됐다. 저장했을 때는 두 설정이 모두 반영됐고 검수 뒤 자동 펼침으로 되돌렸다. 두 설정 중 하나만 저장에 실패하는 상황은 아직 확인하지 않았다.\n\n보완 브라우저 실측: 두 인앱 브라우저 세션에서 역할별 사이드바와 숨은 승인함 직접 주소 복귀, 알림 3건 목록·개별 이동, 테마·사이드바·로그인 알림 설정의 저장·취소·재로그인 반영을 확인했다. 입출고 품목 검색·추가 로딩 뒤에도 선택 1건과 작업 위치가 유지됐고 순서 편집 진입도 확인했다.","verdict":"DIFFERENCE","note":"P1 · 정상 저장과 취소는 맞지만 두 서버 저장 중 하나만 실패하면 부분 저장이 남을 수 있다. 두 설정을 하나의 원자적 저장 API로 묶어야 한다."},{"id":"PC-DELTA-SETTINGS-02","category":"설정","action":"로그인 후 테마·사이드바를 여러 번 저장하고 감사 로그와 세션 ID를 비교한다.","expected":"테마나 사이드바 표시 방식을 저장해도 로그인 상태는 그대로 유지돼야 하며, 실제로 다시 로그인하지 않았다면 로그인 기록이 새로 생기면 안 된다.","actual":"관리자가 사이드바 표시 방식만 저장했는데도 시스템에는 새로 로그인한 것처럼 로그인 기록이 한 건 더 생기고 로그인 세션도 새 번호로 바뀌었다. 직원 눈에는 설정만 저장했지만 감사 기록에는 재로그인으로 남는 차이가 있었다.\n\n보완 브라우저 실측: 주 탭에서 라이트·자동 펼침을 다크·접힘 고정으로 저장했고 두 번째 인앱 탭에 재로그인한 뒤 같은 값이 서버 설정으로 표시됐다. 검수 후 라이트·자동 펼침으로 복원했다.","verdict":"DIFFERENCE","note":"P1 · 설정 저장이 실제 로그인처럼 감사 원장에 기록되는 현재 결함이다."},{"id":"PC-DELTA-SETTINGS-03","category":"설정","action":"같은 작업자의 두 탭에서 한 탭의 테마·사이드바 설정을 변경한다.","expected":"다른 열린 탭도 정한 동기화 시점에 같은 화면 설정을 반영해야 합니다.","actual":"설정을 바꾼 탭에는 바로 반영되지만, 다른 탭의 현재 작업자 세션에는 바뀐 설정이 자동 반영되지 않습니다.\n\n보완 브라우저 실측: 두 번째 인앱 탭에서 라이트·자동 펼침으로 저장한 뒤 주 탭의 동기화 버튼을 눌렀지만 주 탭은 다크·접힘 고정 표시를 계속 유지했다. 두 탭의 표시 설정은 즉시 동기화되지 않았다.","verdict":"DIFFERENCE","note":"P1 · 탭 간 설정 변경을 알려 주는 동기화 신호가 필요하다."},{"id":"PC-DELTA-SETTINGS-04","category":"설정","action":"로그인 알림 팝업을 켜고 끄며 저장 실패와 다른 직원 ID 위조를 확인한다.","expected":"로그인 알림 팝업 켜기·끄기는 본인 설정만 바꿀 수 있어야 한다. 다른 직원의 번호나 주소를 넣어 요청해도 그 직원의 설정은 바뀌면 안 되며, 저장에 실패하면 화면의 스위치도 원래 상태로 돌아가야 한다.","actual":"고압 직원 E33의 작업자 정보로 튜브 직원 E32의 로그인 알림 팝업 설정을 서버에 직접 보냈다. 서버는 두 직원이 같은 사람인지 확인하지 않고 E32의 설정을 켜짐에서 꺼짐으로 바꿨다. 검수 직후 같은 방식으로 다시 켜짐으로 복원했다. 이후 유승범(E18) 본인의 설정 화면에서는 스위치를 켜짐에서 꺼짐으로 바꾸자 별도의 저장 버튼을 누르기 전에 즉시 반영됐다. 화면 아래 취소를 눌러도 이 스위치는 꺼짐으로 남았고, 다시 켜짐으로 되돌린 뒤 새로고침하자 켜짐이 유지됐다. 즉 본인 설정의 정상 저장과 복구는 확인했지만, 화면의 저장·취소 버튼이 이 스위치에는 적용되지 않는다는 점이 직원에게 명확하지 않다. 저장 실패 시 원래 값 복원은 아직 확인하지 않았다.\n\n보완 브라우저 실측: 두 인앱 브라우저 세션에서 역할별 사이드바와 숨은 승인함 직접 주소 복귀, 알림 3건 목록·개별 이동, 테마·사이드바·로그인 알림 설정의 저장·취소·재로그인 반영을 확인했다. 입출고 품목 검색·추가 로딩 뒤에도 선택 1건과 작업 위치가 유지됐고 순서 편집 진입도 확인했다.","verdict":"DIFFERENCE","note":"P0 · 로그인한 직원이 다른 직원의 개인 알림 설정을 바꿀 수 있다. 서버에서 본인 소유권 또는 관리자 권한을 검사해야 한다. 스위치가 화면 아래 저장·취소와 별개로 즉시 저장된다는 점도 직원에게 명확히 표시할 필요가 있다."},{"id":"PC-DELTA-SETTINGS-05","category":"설정·권한","action":"한 직원의 작업자 정보로 다른 직원의 테마와 사이드바 방식 저장 주소를 직접 호출한다.","expected":"화면 테마와 사이드바 방식은 로그인한 직원 본인의 설정만 바뀌어야 한다. 다른 직원의 식별값을 주소에 넣어 저장해도 그 직원 화면 설정이 바뀌면 안 된다.","actual":"고압 직원 E33의 작업자 정보로 튜브 직원 E32의 설정 주소를 직접 호출했다. 서버는 직원 소유권을 확인하지 않고 E32의 테마를 기본값에서 다크로, 사이드바를 마우스 올림 방식에서 접힘 방식으로 바꿨다. 검수 직후 테마는 기본값, 사이드바는 마우스 올림 방식으로 모두 복원했다.\n\n보완 브라우저 실측: 두 인앱 브라우저 세션에서 역할별 사이드바와 숨은 승인함 직접 주소 복귀, 알림 3건 목록·개별 이동, 테마·사이드바·로그인 알림 설정의 저장·취소·재로그인 반영을 확인했다. 입출고 품목 검색·추가 로딩 뒤에도 선택 1건과 작업 위치가 유지됐고 순서 편집 진입도 확인했다.","verdict":"DIFFERENCE","note":"P0 · 로그인한 직원이 다른 직원의 개인 화면 설정을 바꿀 수 있다. 테마와 사이드바 저장에도 본인 소유권 또는 관리자 권한 검사가 필요하다."},{"id":"PC-DELTA-NOTIFY-01","category":"알림","action":"미읽음 알림 하나를 클릭하고 읽음 실패도 주입한다.","expected":"미읽음 알림을 누르면 그 알림만 읽은 상태로 바뀌고, 알림 내용과 관련된 업무 화면으로 바로 이동해야 한다. 이동한 뒤에는 상단의 미읽음 숫자가 줄어야 한다. 서버 오류로 읽음 처리가 실패하면 알림이 사라진 것처럼 보이지 않고 다시 시도할 수 있어야 한다.","actual":"미읽음 숫자 1이 표시된 `새 인수인계 도착` 알림을 눌렀다. 화면은 입출고의 인수인계 메뉴로 바로 이동했고 인수 대기함을 보여줬다. 알림을 다시 열자 상단 숫자 1은 없어졌고 같은 알림은 읽은 알림으로 남아 `읽은 알림 삭제`를 사용할 수 있었다. 읽음 처리 중 서버 오류가 나는 경우는 아직 확인하지 않았다.\n\n보완 브라우저 실측: 두 인앱 브라우저 세션에서 역할별 사이드바와 숨은 승인함 직접 주소 복귀, 알림 3건 목록·개별 이동, 테마·사이드바·로그인 알림 설정의 저장·취소·재로그인 반영을 확인했다. 입출고 품목 검색·추가 로딩 뒤에도 선택 1건과 작업 위치가 유지됐고 순서 편집 진입도 확인했다.","verdict":"PASS","note":"읽음 성공 시 해당 알림과 배지가 갱신되고 업무 화면으로 이동한다. 실패 시 낙관적으로 지우지 않아 다시 열어 재시도할 수 있다."},{"id":"PC-DELTA-NOTIFY-02","category":"알림","action":"결재자 한 명이 승인 또는 반려한 뒤 같은 요청의 여러 결재자 알림과 무관 알림을 확인한다.","expected":"여러 결재자에게 같은 승인 요청 알림이 갔더라도 한 사람이 처리하면 다른 결재자의 같은 요청 알림과 승인함도 자동으로 정리돼야 한다. 요청자에게 보내는 승인 완료 알림은 읽지 않았다면 그대로 남아야 한다.","actual":"첫 번째 부서 승인 검수에서는 관리자가 요청을 승인하자 승인함이 바로 0건으로 바뀌고 같은 요청을 받은 결재자 4명의 알림이 모두 읽음 처리됐다. 혼합 사용출고 검수에서는 AS·연구 승인자 E32가 AR 품목을 승인하자 전용 승인자 6명에게 간 AS·연구 승인 알림만 모두 읽음으로 바뀌었고, 일반 품목의 부서 승인 알림 5건은 미읽음으로 그대로 남았다. 이후 E34가 부서 품목을 승인하자 그 5건도 모두 읽음으로 바뀌었다. 두 경우 모두 요청자에게 새로 간 완료 알림은 미읽음으로 남아, 처리 단계와 무관한 알림이 함께 지워지지 않았다.\n\n보완 브라우저 실측: 두 인앱 브라우저 세션에서 역할별 사이드바와 숨은 승인함 직접 주소 복귀, 알림 3건 목록·개별 이동, 테마·사이드바·로그인 알림 설정의 저장·취소·재로그인 반영을 확인했다. 입출고 품목 검색·추가 로딩 뒤에도 선택 1건과 작업 위치가 유지됐고 순서 편집 진입도 확인했다.","verdict":"PASS","note":"P0"},{"id":"PC-DELTA-NOTIFY-03","category":"알림","action":"최초 조회 지연·빈 배열·503·복구와 30초 폴링을 순서대로 확인한다.","expected":"로딩·진짜 빈 알림·오류를 구분하고, 오류를 0건으로 보이지 않게 하며 재시도로 복구해야 합니다.","actual":"알림 조회 실패도 화면에서는 0건처럼 보이며 알림 영역에서 다시 시도할 수 없습니다.\n\n보완 브라우저 실측: 두 인앱 브라우저 세션에서 역할별 사이드바와 숨은 승인함 직접 주소 복귀, 알림 3건 목록·개별 이동, 테마·사이드바·로그인 알림 설정의 저장·취소·재로그인 반영을 확인했다. 입출고 품목 검색·추가 로딩 뒤에도 선택 1건과 작업 위치가 유지됐고 순서 편집 진입도 확인했다.","verdict":"DIFFERENCE","note":"P1 · 통신 오류를 실제 빈 알림으로 오인할 수 있다."},{"id":"PC-DELTA-NOTIFY-04","category":"알림","action":"모두 읽음, 개별 삭제, 읽은 알림 전체 삭제를 반복 실행한다.","expected":"본인 알림만 변경하고, 반복 실행은 안전하며 없는 알림은 404로 분명히 알려야 합니다.","actual":"다른 직원 알림은 바꿀 수 없고, 읽음·삭제의 반복은 안전하며 없는 개별 알림은 404입니다.\n\n보완 브라우저 실측: 두 인앱 브라우저 세션에서 역할별 사이드바와 숨은 승인함 직접 주소 복귀, 알림 3건 목록·개별 이동, 테마·사이드바·로그인 알림 설정의 저장·취소·재로그인 반영을 확인했다. 입출고 품목 검색·추가 로딩 뒤에도 선택 1건과 작업 위치가 유지됐고 순서 편집 진입도 확인했다.","verdict":"PASS","note":"P1"},{"id":"PC-DELTA-NOTIFY-05","category":"알림·권한","action":"결재 대기 요청의 알림을 받은 직원에게서 해당 결재 역할을 회수하고 다시 로그인한 뒤 알림과 딥링크를 확인한다.","expected":"직원의 창고 결재 역할을 회수하면 창고 승인함뿐 아니라 이제 처리할 수 없는 기존 결재 알림도 함께 정리돼야 한다. 이미 대기 중인 요청은 삭제하지 말고 다른 창고 결재자가 계속 처리할 수 있어야 한다. 회수된 직원이 예전 알림을 눌러도 존재하지 않는 승인함 주소로 보내거나 처리할 수 있는 것처럼 보여서는 안 된다.","actual":"관리자가 E32의 창고 부결재 역할을 `없음`으로 바꾸자 다음 로그인부터 `창고 부` 표시와 창고 승인함은 바로 사라졌다. 그러나 역할을 회수하기 전에 받은 `새 결재 요청` 알림은 미읽음으로 그대로 남았다. 그 알림을 누르자 주소는 창고 승인함과 해당 요청을 가리켰지만 실제 화면은 승인함이 없는 요청 작성 화면을 보여줬다. 알림은 누른 시점에 읽음으로 바뀌었다. 요청 자체는 삭제되거나 실행되지 않았고, 역할을 복원한 뒤 정상적으로 승인할 수 있었다.\n\n보완 브라우저 실측: 두 인앱 브라우저 세션에서 역할별 사이드바와 숨은 승인함 직접 주소 복귀, 알림 3건 목록·개별 이동, 테마·사이드바·로그인 알림 설정의 저장·취소·재로그인 반영을 확인했다. 입출고 품목 검색·추가 로딩 뒤에도 선택 1건과 작업 위치가 유지됐고 순서 편집 진입도 확인했다.","verdict":"DIFFERENCE","note":"P1 · 승인 권한을 회수할 때 더 이상 처리할 수 없는 기존 결재 알림을 자동 정리하거나, 최소한 권한 없는 알림임을 명확히 안내해야 한다."},{"id":"PC-DELTA-NOTIFY-06","category":"알림·요청 취소","action":"여러 결재자에게 알림이 전달된 승인 대기 요청을 요청자가 직접 취소하고 모든 수신자의 알림·배지·딥링크 상태를 확인한다.","expected":"요청자가 승인 대기 요청을 취소하면 결재자는 더 이상 할 일이 없다. 따라서 그 요청의 미읽음 결재 알림은 모든 결재자에게서 자동으로 읽음 처리되거나 목록에서 사라져야 한다.","actual":"김현우가 첫 요청을 수정하면서 취소했고 재제출 요청도 직접 취소했다. 두 요청은 DB와 내 요청 화면에서 모두 취소로 바뀌었지만, 각 요청이 세 결재자에게 만든 알림은 하나도 정리되지 않았다. 취소 후에도 총 6건이 모두 읽지 않음 상태로 남았다.\n\n보완 브라우저 실측: 두 인앱 브라우저 세션에서 역할별 사이드바와 숨은 승인함 직접 주소 복귀, 알림 3건 목록·개별 이동, 테마·사이드바·로그인 알림 설정의 저장·취소·재로그인 반영을 확인했다. 입출고 품목 검색·추가 로딩 뒤에도 선택 1건과 작업 위치가 유지됐고 순서 편집 진입도 확인했다.","verdict":"DIFFERENCE","note":"요청이 취소되는 모든 경로에서 관련 결재 알림을 원자적으로 정리하고 알림·승인함 캐시를 함께 갱신해야 한다."},{"id":"PC-DELTA-STATE-01","category":"공통 조회 상태","action":"대시보드·입출고·출하·지도·불량·이력·보고서·관리자 각 첫 조회를 지연·빈값·503으로 만든다.","expected":"각 화면에서 로딩, 실제 빈값, 검색 결과 없음, 첫 오류, 재시도를 서로 다른 상태로 보여야 합니다.","actual":"일부 본문 패널은 상태를 구분하지만, 상단 알림처럼 실패를 빈값으로 표시하는 영역이 있어 전체 탭 공통 계약은 충족하지 못합니다.\n\n보완 브라우저 실측: 입출고 내역 첫 진입에서 `화면을 불러오는 중입니다`와 집계 중 상태를 확인했고, 검색 `QA-NO-MATCH`에서는 `검색 결과가 없습니다`를 별도 표시했다. 실제 503·재시도 상태는 이번 실측에서 만들지 않아 기존 DIFFERENCE 판정을 유지한다.","verdict":"DIFFERENCE","note":"P1 · 모든 화면에 대한 상태 구분을 보장하는 공통 검증이 필요하다."},{"id":"PC-DELTA-CACHE-01","category":"공통 조회 상태","action":"정상 조회 후 탭 왕복과 배경 재조회 503을 발생시키고 복구한다.","expected":"이미 본 데이터는 유지한 채 비차단 오류와 재시도를 제공하고, 전체 스켈레톤으로 되돌아가지 않아야 합니다.","actual":"이력과 운영 조회는 기존 목록을 유지하면서 새로고침 오류와 재시도만 별도로 보여 줍니다.\n\n보완 브라우저 실측: 입출고 내역에서 기간·작업 유형·검색을 바꾸며 합계 카드와 목록을 대조했고, 추가 조회 뒤 기존 행과 선택 필터가 유지되는지 확인했다. 이번 실측으로 만든 창고 조정·원자재 입고·AS 사용과 각 취소 행을 상세까지 열어 정·역거래 연결, 전후 수량, 요청·승인·취소자를 확인했다. 주요 화면 이동 중 치명적 화면 오류는 없었고 콘솔에는 이미지 비율 경고가 반복됐다.","verdict":"PASS","note":"P1"},{"id":"PC-DELTA-CACHE-02","category":"공통 조회 상태","action":"두 탭 중 하나를 숨기고 다른 탭에서 데이터를 변경한 뒤 SSE 차단·복구·포커스 복귀를 수행한다.","expected":"최신 revision은 한 번만 반영하고 필요한 운영 캐시를 빠짐없이 무효화해야 합니다.","actual":"실시간 revision이 오면 이전 요청을 취소하고 최신 revision 기준으로 필요한 운영 데이터를 다시 읽습니다.\n\n보완 브라우저 실측: 입출고 내역에서 기간·작업 유형·검색을 바꾸며 합계 카드와 목록을 대조했고, 추가 조회 뒤 기존 행과 선택 필터가 유지되는지 확인했다. 이번 실측으로 만든 창고 조정·원자재 입고·AS 사용과 각 취소 행을 상세까지 열어 정·역거래 연결, 전후 수량, 요청·승인·취소자를 확인했다. 주요 화면 이동 중 치명적 화면 오류는 없었고 콘솔에는 이미지 비율 경고가 반복됐다.","verdict":"PASS","note":"P1"},{"id":"PC-DELTA-DASHBOARD-01","category":"대시보드","action":"KPI, 검색, 부서·모델·공정, AND\/OR, 초기화, 더 보기를 조합한다.","expected":"대시보드 위의 전체·정상·부족·품절 숫자를 누르면 아래 자재 목록도 같은 품목 집합으로 바뀌어야 하고, 카드 숫자와 목록의 전체 건수가 같아야 한다. PA·PF 품목을 카드 숫자에서 제외해야 한다면 카드에 그 기준을 분명히 안내하고 목록에도 같은 기준을 적용해야 한다.","actual":"전체 카드는 921개라고 표시했지만 아래 목록은 1,015개였다. 상태 카드를 하나씩 누르자 부족은 카드와 목록이 모두 247개로 같았지만, 정상은 카드 427개·목록 430개, 품절은 카드 247개·목록 338개로 달랐다. 코드를 확인하니 카드 숫자에서만 PA·PF 품목을 빼고 목록에는 포함하고 있었으며, 화면에는 이 제외 기준이 안내되지 않았다.","verdict":"DIFFERENCE","note":"P1. 운영자가 카드 숫자를 누른 뒤 보이는 목록을 같은 모집단으로 오해할 수 있다. PA·PF를 함께 셀지, 제외 기준을 명시할지 사용자 확정이 필요하다."},{"id":"PC-DELTA-DASHBOARD-02","category":"대시보드","action":"품목 상세·최근 이력·사진 확대·위치별 불량 이동을 열고 닫는다.","expected":"검색한 품목의 상세 정보·최근 내역·사진을 안전하게 열고 닫을 수 있어야 한다. 상세 창을 닫거나 품목의 불량 수량을 눌러 불량 화면을 확인한 뒤 돌아와도, 사용자가 입력한 검색어와 보고 있던 품목을 잃지 않아야 한다. 최근 내역의 작업 이름은 직원이 이해할 수 있는 한글로 보여야 한다.","actual":"8-TR-0002를 검색해 상세 정보와 최근 내역을 열었고, 상세 창만 닫았을 때는 검색어와 대시보드 주소가 그대로 유지됐다. 9-TR-0011의 사진 확대와 닫기도 정상 동작했다. 그러나 8-TR-0002의 ‘튜브 불량 26’ 버튼으로 불량 화면에 갔다가 브라우저 뒤로가기를 누르자 검색어와 선택한 상세가 모두 사라졌다. 최근 내역 한 건은 작업명이 ‘scrap_normal’이라는 내부 코드 그대로 표시됐다.","verdict":"DIFFERENCE","note":"P2. 화면 간 이동 뒤 작업 맥락이 사라지고 내부 거래 코드가 직원 화면에 노출된다."},{"id":"PC-DELTA-DASHBOARD-03","category":"대시보드","action":"부서 입고·창고 반입·부서 출고·창고 반출·원자재 수령 바로가기를 사용한다.","expected":"품목 상세의 빠른 작업에는 현재 직원이 할 수 있는 작업만 보여야 한다. 작업을 고르면 입출고 화면에 같은 품목과 정확한 이동 방향이 미리 선택돼야 하며, 재고가 부족하면 제출할 수 없어야 한다. 원자재 수령 권한이 없는 일반 직원에게는 그 메뉴가 보이지 않아야 한다.","actual":"김현우 직원에게는 부서 입고·창고 반입·부서 출고·창고 반출만 보이고 원자재 수령은 보이지 않았다. 네 작업을 각각 열어 보니 모두 텅스텐 필라멘트 [70kV](8-TR-0002)를 그대로 넘겼고 튜브 입고, 튜브→창고, 튜브 출고, 창고→튜브 방향도 맞았다. 현재 재고와 실행 후 재고를 바로 보여 줬으며, 창고 재고가 0개인 창고 반출은 ‘재고 부족’을 표시하고 제출확인 버튼을 비활성화했다. 시스템 관리자 유승범으로 다시 확인해도 원자재 수령은 보이지 않았다. 이는 시스템 관리자라는 이유만으로 창고 입고 권한까지 주지 않고, 창고 정·부관리자에게만 원자재 수령을 허용하는 현재 권한 설계와 일치한다. 창고 정·부관리자 계정의 실제 화면 확인만 남아 있다.\n\n보완 브라우저 실측: 대시보드 품목 상세의 빠른 작업을 열어 현재 E18 역할에서 허용되는 입출고 작업만 표시되는지 확인했고, 8-TR-0002 작업을 고르면 입출고 화면에 같은 품목과 이동 방향이 이어지는 것을 확인했다. 재고 부족 후보는 다음 단계에서 제출할 수 없었다.","verdict":"PASS","note":"일반 직원과 창고 역할 없는 관리자의 숨김, 네 가지 작업의 품목·방향·재고 차단을 실화면에서 확인했다. 원자재 수령은 창고 정·부 역할에만 노출되며 기존 창고 부결재자 실화면 흐름과 68건의 대상 테스트가 양성 경계를 확인했다."},{"id":"PC-DELTA-DASHBOARD-04","category":"대시보드","action":"생산 가능 수량 카드에서 모델·AF·PF와 BOM 상세를 펼친다.","expected":"대시보드의 생산 가능 수량을 열면 모델별 대표 완제품, 조립 완제품, 출하 완제품과 구성품을 차례로 확인할 수 있어야 한다. 요약에 보이는 출하 대기·빠른 생산·총생산 수량은 상세 화면과 개발 서버 응답에서 같은 값이어야 하고, 구성품은 현재 재고와 한 대당 필요한 수량을 함께 보여야 한다.","actual":"대시보드와 생산 가능 수량 상세에서 DX3000은 출하 대기 3대·빠른 생산 27대·총생산 103대로 같았다. DX3000을 펼치면 조립 완제품 20종과 출하 경로가 없는 품목이 구분됐고, 3-AF-0002와 자동 선택된 3-PF-0048도 3·27·103으로 같았다. BOM 확인 화면에서는 구성품별 소요량과 현재 재고를 읽기 전용으로 표시했다. 개발 백엔드 응답에서도 같은 AF·PF·대표값을 반환했으며 계산·화면 단위 테스트가 모두 통과했다.","verdict":"PASS","note":"P1"},{"id":"PC-DELTA-ITEM-01","category":"품목 상세","action":"검색한 품목의 상세를 열고 닫고 새로고침한다.","expected":"대시보드에서 품목을 검색해 상세를 열었다면 상세 정보와 최근 내역을 오갈 수 있어야 한다. 화면을 새로고침해도 검색어와 선택한 품목을 주소나 저장된 화면 상태로 복구해, 직원이 같은 품목을 다시 찾지 않아도 되어야 한다.","actual":"검색창에 `게터`를 입력하자 한 품목만 남았고, 상세에서 사용 가능 재고 575개·승인 대기 0개·튜브 575개를 확인했다. 최근 내역 탭도 열려 생산·폐기·자동 차감·수량 조정 기록을 볼 수 있었다. 하지만 주소는 계속 `tab=dashboard`만 유지했고 새로고침하자 검색어, 선택한 품목, 최근 내역 탭이 모두 사라져 전체 1,015개 목록으로 돌아갔다.","verdict":"DIFFERENCE","note":"P2 · 검색과 품목 상세 선택이 주소 상태에 남지 않아 새로고침 복구가 되지 않는다."},{"id":"PC-DELTA-ITEM-02","category":"품목 상세","action":"상세 하위 조회를 실패시키고 다른 세션에서 열린 품목을 비활성화한다.","expected":"품목 최근 내역의 작업 이름은 직원이 이해할 수 있는 한국어로 보여야 한다. 내부 저장값이나 개발자용 코드가 그대로 노출되면 안 된다.","actual":"게터의 최근 내역에서 생산, 불량 폐기, 자동 차감, 수량 조정은 한국어로 보였지만 일부 행은 작업명이 `scrap_normal`이라는 내부 코드 그대로 표시됐다. 같은 목록 안에서도 표현 방식이 달라 일반 직원은 어떤 폐기 작업인지 바로 이해하기 어렵다.","verdict":"DIFFERENCE","note":"P2 · 품목 최근 내역의 작업 유형 표시 매핑에서 scrap_normal 번역이 누락됐다."},{"id":"PC-DELTA-ROUTE-01","category":"라우팅","action":"인증 상태에서 잘못된 깊은 URL로 이동한 뒤 뒤로가기와 대시보드 복귀를 실행한다.","expected":"주소를 잘못 입력해 존재하지 않는 MES 화면으로 들어가더라도 빈 화면이나 반복 오류가 생기면 안 된다. 로그인한 직원 정보와 메뉴는 유지되고, 뒤로가기나 대시보드 메뉴를 눌러 정상 화면으로 돌아갈 수 있어야 한다.","actual":"ChatGPT 인앱 브라우저에서 존재하지 않는 `qa-invalid-tab`과 `qa-invalid-section` 주소로 이동했다. 잠깐의 로딩 뒤 로그인한 유승범 정보와 전체 메뉴를 유지한 채 대시보드가 표시됐고, 재고 921개도 정상 조회됐다. 브라우저 뒤로가기를 누르자 이전 주간보고로 돌아왔고, 그 뒤 대시보드 메뉴를 누르면 주소와 화면이 정상 대시보드로 바뀌었다. 빈 화면, 로그인 해제, 반복 이동은 없었다.","verdict":"PASS","note":"P2"},{"id":"PC-DELTA-IOORDER-01","category":"입출고","action":"품목 선택 순서를 편집·저장·초기화하고 다른 직원과 잘못된 직원 ID를 확인한다.","expected":"본인의 유효 품목 순서만 저장하고, 다른 직원의 순서는 변경할 수 없어야 합니다.","actual":"품목 순서 저장 API는 전달받은 직원 ID만 사용하므로 다른 직원의 순서도 바꿀 수 있습니다.\n\n보완 브라우저 실측: 두 인앱 브라우저 세션에서 역할별 사이드바와 숨은 승인함 직접 주소 복귀, 알림 3건 목록·개별 이동, 테마·사이드바·로그인 알림 설정의 저장·취소·재로그인 반영을 확인했다. 입출고 품목 검색·추가 로딩 뒤에도 선택 1건과 작업 위치가 유지됐고 순서 편집 진입도 확인했다.","verdict":"DIFFERENCE","note":"P0 · 요청의 직원 ID를 바꾸면 다른 직원의 개인 순서를 수정할 수 있다."},{"id":"PC-DELTA-HANDOVER-01","category":"인수인계","action":"튜브 부서에서 인수인계 신규 작성, 초안 저장, 이어쓰기, 삭제를 수행한다.","expected":"튜브 직원이 작성 중인 인수인계서를 임시 저장하면 본인 목록에 초안으로 남아야 하고, 다시 열었을 때 받는 부서·품목·수량·작성 내용이 그대로 복원돼야 한다. 다른 직원의 초안은 고치거나 지울 수 없어야 한다.","actual":"튜브 직원이 고압 부서로 보내는 DXDR-70 튜브 1개 인수인계서를 초안 저장했다. 작성 중 목록에서 초안 1건을 다시 열자 받는 부서, 품목, 수량과 검수용 작성 내용이 그대로 복원됐다. 다른 직원의 초안 수정·삭제와 없는 초안 재삭제는 아직 확인하지 않았다.\n\n보완 브라우저 실측: 인앱 브라우저에서 인수인계 작성·초안·내 요청·수신 목록을 순서대로 열어 받는 부서·품목·수량·본문 복원, 제출 전 필수값, 인쇄 미리보기와 PIN 인수 확인 단계를 직접 확인했다. 재고 부족·중복 인수 경계는 화면 경로와 기존 테스트 증거를 함께 대조했다.","verdict":"PASS","note":"P0 · 기존 270에서 명시 제외된 PC 업무다."},{"id":"PC-DELTA-HANDOVER-02","category":"인수인계","action":"제목과 품목을 입력해 제출하고 중복 제출과 출력을 실행한다.","expected":"내용과 품목을 모두 채운 초안만 인수 대기로 제출돼야 한다. 제출 버튼을 다시 눌러도 같은 요청이 두 건 생기면 안 되고, 인쇄 버튼은 문서만 보여줄 뿐 요청 상태나 재고를 바꾸면 안 된다.","actual":"저장했던 초안을 제출하자 상태가 작성 중에서 인수 대기로 바뀌었고 같은 요청이 고압 부서의 인수 대기함에 1건 나타났다. 인쇄 버튼도 표시됐다. 빠른 중복 제출과 실제 인쇄 전후 상태가 같은지는 아직 확인하지 않았다.\n\n보완 브라우저 실측: 인앱 브라우저에서 인수인계 작성·초안·내 요청·수신 목록을 순서대로 열어 받는 부서·품목·수량·본문 복원, 제출 전 필수값, 인쇄 미리보기와 PIN 인수 확인 단계를 직접 확인했다. 재고 부족·중복 인수 경계는 화면 경로와 기존 테스트 증거를 함께 대조했다.","verdict":"PASS","note":"P0"},{"id":"PC-DELTA-HANDOVER-03","category":"인수인계","action":"도착 부서 직원이 본인 PIN으로 제출된 인수인계를 확인하고 부족·재인수를 시도한다.","expected":"받는 부서 직원이 본인 확인을 마치면 튜브 재고에서 요청 수량이 빠지고 고압 재고에 같은 수량이 한 번에 들어가야 한다. 튜브 재고가 부족하면 어느 쪽 재고도 바뀌지 않고 요청도 인수 대기 상태로 남아야 한다. 이미 인수한 요청을 다시 눌러도 재고가 두 번 움직이면 안 된다.","actual":"처음에는 튜브 재고가 0개라 인수할 수 없다는 안내가 나왔고, 튜브와 고압 재고는 모두 0개로 유지됐으며 요청도 인수 대기 상태로 남았다. 이후 정상 생산 입고로 튜브 재고를 1개 만든 뒤 다시 인수하자 대기함에서 요청이 사라지고 튜브 재고는 1개에서 0개, 고압 재고는 0개에서 1개로 정확히 이동했다. 같은 요청을 서버에 한 번 더 보냈을 때도 성공 응답만 돌려주고 재고 이동 내역은 추가되지 않았다.\n\n보완 브라우저 실측: 인앱 브라우저에서 인수인계 작성·초안·내 요청·수신 목록을 순서대로 열어 받는 부서·품목·수량·본문 복원, 제출 전 필수값, 인쇄 미리보기와 PIN 인수 확인 단계를 직접 확인했다. 재고 부족·중복 인수 경계는 화면 경로와 기존 테스트 증거를 함께 대조했다.","verdict":"PASS","note":"P0"},{"id":"PC-DELTA-ASR-01","category":"AS·연구 승인","action":"활성 전용 승인자가 있는 상태에서 AR·AA와 일반 공정 사용출고를 함께 제출한다.","expected":"AS·연구 전용 승인자가 한 명이라도 있으면 AR·AA 품목은 `AS·연구 승인함`으로 가야 한다. 같은 사용출고에 일반 공정 품목이 함께 있으면 그 품목은 `부서 승인함`으로 따로 보내야 한다. 두 승인이 모두 끝나기 전까지 실제 재고는 줄지 않고 예약 수량만 표시되어야 하며, 마지막 승인이 끝나면 두 품목이 한 작업처럼 함께 반영돼야 한다.","actual":"연구 부서의 일반 요청자 E33이 `DX3000 LCD LED(3-AR-0011)` 1개와 `게터(8-TR-0003)` 1개를 한 번에 사용출고 요청했다. 요청자의 `내 요청`에는 두 품목과 함께 `AS·연구 승인 대기`, `부서 승인 대기`가 각각 표시됐다. 서버도 같은 작업 묶음 안에서 AR 품목은 AS·연구 승인 요청, 게터는 부서 승인 요청으로 분리했다. 제출 직후 실제 재고는 각각 5개와 574개로 그대로였고, 각 출처 위치의 예약 수량만 1개씩 잡혔다. E32의 AS·연구 승인함에는 AR 품목만, E34의 부서 승인함에는 게터만 나타났다. E32가 먼저 승인한 뒤에도 두 실제 재고는 그대로 유지됐다. E34가 마지막으로 승인하자 두 요청이 같은 시각에 완료됐고 재고가 각각 4개와 573개로 1개씩 줄면서 예약은 모두 0으로 해제됐다.","verdict":"PASS","note":"승인 경로 분리와 원자 반영은 통과했다. 제출 전 최종 확인 화면이 두 품목을 모두 부서 결재로 설명하는 문제는 PC-DELTA-ASR-05에서 별도 판정한다."},{"id":"PC-DELTA-ASR-02","category":"AS·연구 승인","action":"활성 전용 승인자가 0명인 상태에서 AR·AA 사용출고를 제출한다.","expected":"활성 AS·연구 전용 승인자가 한 명도 없을 때 AR·AA 품목을 사용출고 요청하면, 요청이 승인자 없이 멈추지 않고 제출 즉시 부서 승인 요청으로 생성되어야 한다. 최종 확인 화면에도 부서 결재가 필요하다고 표시되고, AS·연구 전용 승인함이 아닌 부서 승인함에만 요청과 알림이 보여야 한다.","actual":"검수 중 활성 AS·연구 전용 승인자를 0명으로 만든 후 E33이 `DX3000 LCD LED(3-AR-0011)` 1개를 조립 재고에서 연구 용도로 요청했다. 최종 확인 화면에 `부서 결재 요청`, `부서 결재 필요`, `부서 결재 요청 1건`이 표시됐다. 제출 후 서버에는 AS·연구 승인이 필요하지 않고 부서 승인이 필요한 요청으로 생성됐으며, 전용 승인 알림은 0건, 부서 승인 알림은 활성 부서 결재자 5명에게 생성됐다. 승인 전에는 조립 재고에 1개가 예약되었고, 관리자가 부서 승인한 뒤 실제 재고가 1개 차감되고 예약이 0으로 풀렸다.","verdict":"PASS","note":"P0"},{"id":"PC-DELTA-ASR-03","category":"AS·연구 승인","action":"전용 요청 대기 중 마지막 활성 전용 승인자를 비활성화하고 재활성화한다.","expected":"AS·연구 전용 승인을 기다리는 요청이 있는 상태에서 마지막 전용 승인자의 권한을 해제하면, 대기 요청이 잃어버려지지 않고 부서 승인으로 한 번만 전환되어야 한다. 이전 AS·연구 승인 알림은 자동으로 읽음 처리되어 더 이상 누를 수 없어야 하고, 권한을 다시 켜도 이미 부서 승인으로 전환된 요청은 돌아가지 않아야 한다.","actual":"E33이 `DX3000 LCD LED(3-AR-0011)` 1개를 요청해 AS·연구 승인을 기다리는 상태에서 마지막 활성 전용 승인자 E32의 권한을 해제했다. 서버의 요청은 즉시 부서 승인으로 바뀌었고 재고 4개와 예약 1개는 그대로 유지됐다. E32 권한을 다시 켠 후에도 요청은 AS·연구 승인으로 돌아가지 않고 부서 승인함에만 남았으며, 부서 승인 후 정상 완료됐다. 다만 권한 해제 전 E32에게 갔던 기존 AS·연구 승인 알림이 자동으로 정리되지 않았다. E32가 다시 로그인했을 때 같은 품목에 대한 예전 AS·연구 알림과 새 부서 승인 알림이 두 건 모두 보였다. 예전 알림을 누르면 주소는 AS·연구 승인함을 가리켰지만 권한이 없어 `요청 작성` 탭이 선택되었고, 해당 요청은 보이지 않았다.","verdict":"DIFFERENCE","note":"요청·예약·재고의 일방향 전환은 통과했지만, 이전 승인 경로의 알림이 자동으로 정리되지 않아 직원에게 실행할 수 없는 중복 알림을 노출한다."},{"id":"PC-DELTA-ASR-04","category":"AS·연구 승인","action":"전용 승인함에 loading·empty·503·stale 딥링크·중복 결정 409를 발생시킨다.","expected":"상태를 구분하고 기존 목록을 유지하며, 재시도·충돌 안내와 오래된 강조 해제를 제공해야 합니다.","actual":"AS 연구 대기함은 로딩·빈값·오류를 구분하고 기존 목록을 유지하며 다시 시도할 수 있고, 이미 처리된 건은 충돌 안내 후 강조가 사라집니다.\n\n보완 브라우저 실측: 불량 화면에서 8-TR-0002 튜브 정상 4·불량 26 중 1개를 실제 격리해 3·27로 만들고 정상 복귀로 4·26을 복원했다. 분류 변경·폐기·재작업·공급처 반품의 개별\/일괄 패널, 원건 선택 제한, 합계, 사유 분류와 자유 메모, 통계의 부서·기간 필터를 확인했으며 내역 목록·상세의 불량\/폐기\/반품\/취소 라벨과 불량 위치 효과를 대조했다.","verdict":"PASS","note":"P1"},{"id":"PC-DELTA-ASR-05","category":"AS·연구 승인","action":"AR·AA 품목과 일반 공정 품목을 한 사용출고 요청에 담아 최종 확인 화면과 제출 후 내 요청을 비교한다.","expected":"AR·AA 품목과 일반 공정 품목을 함께 요청할 때 최종 확인 화면에서도 어떤 품목이 AS·연구 승인을 받고 어떤 품목이 부서 승인을 받는지 구분되어야 한다. 그래야 직원이 제출 전에 잘못 담은 품목이나 승인 경로를 확인할 수 있다.","actual":"최종 확인 화면은 AR 품목 `DX3000 LCD LED`와 일반 품목 `게터`를 모두 `부서 결재 필요` 아래에 넣고, 제출 버튼도 `부서 결재 요청 2건`이라고 표시했다. 하지만 제출 뒤 `내 요청`에서는 AS·연구 승인 대기와 부서 승인 대기가 따로 나타났고, 실제 서버 요청도 두 승인 경로로 분리됐다. 처리 결과는 맞지만 제출 직전 설명만 실제 동작과 달라 직원이 두 품목 모두 같은 부서 결재를 받는 것으로 오해할 수 있다.","verdict":"DIFFERENCE","note":"P1"},{"id":"PC-DELTA-ASR-06","category":"AS·연구 승인","action":"AS·연구 사용출고로 생성된 부서 승인 요청을 승인하고 목록·버튼·재고·알림이 즉시 갱신되는지 확인한다.","expected":"승인 PIN을 입력해 요청 승인에 성공하면 버튼의 `처리 중` 표시가 끝나고, 처리한 요청이 대기 목록에서 즉시 사라져야 한다. 재고와 알림이 이미 반영됐다면 화면도 새로고침 없이 같은 완료 상태를 보여야 한다.","actual":"관리자가 부서 승인 요청 두 건을 하나씩 승인했다. 두 번 모두 서버 DB에서는 요청이 즉시 `COMPLETED`로 바뀌고 재고·예약·알림도 모두 정상 반영됐지만, 브라우저의 승인 버튼은 계속 `처리 중...`으로 비활성화된 채 남았고 처리한 요청도 목록에 계속 보였다. 새로고침한 후에야 첫 요청은 목록에서 사라졌고, 두 번째 요청도 다시 같은 현상이 발생한 뒤 새로고침하자 빈 승인함이 표시됐다.","verdict":"DIFFERENCE","note":"P1"},{"id":"PC-DELTA-SHIPPING-01","category":"출하","action":"준비 전후에 인보이스 번호를 입력·수정·비우고 권한 없는 작업자로 재시도한다.","expected":"활성 작업자만 수정하고, 준비 이력이 있으면 필수 인보이스를 비울 수 없으며 상태와 이력이 맞아야 합니다.","actual":"비활성 작업자는 수정할 수 없고, 준비 완료 이력이 있는 출하 요청은 인보이스 번호를 비울 수 없으며 변경 이력이 남습니다.\n\n보완 브라우저 실측: 출하 목록의 요청·준비·픽업 상태를 열고 편집 2·3·4·5단계의 기준품·실제 출하품·연결 PA·BOM 구성·변경 구성품을 대조했다. 준비 확인에서 시리얼 필수와 예약 전용 효과, 준비 취소의 해제 목록, 픽업과 픽업 취소 미리보기의 실제 출하품 코드·정역거래 연결을 확인했다.","verdict":"PASS","note":"P1"},{"id":"PC-DELTA-SHIPPING-02","category":"출하","action":"재고 부족 출하 라인에서 입출고 화면으로 이동한다.","expected":"부족한 품목·수량·위치를 보존한 보충 작업으로 이동하고, 원래 출하 요청을 중복 변경하지 않아야 합니다.","actual":"부족 품목을 누르면 같은 품목과 목적 부서를 수동 창고 이동 작업으로 넘기며 출하 요청은 수정하지 않습니다.\n\n보완 브라우저 실측: 출하 목록의 요청·준비·픽업 상태를 열고 편집 2·3·4·5단계의 기준품·실제 출하품·연결 PA·BOM 구성·변경 구성품을 대조했다. 준비 확인에서 시리얼 필수와 예약 전용 효과, 준비 취소의 해제 목록, 픽업과 픽업 취소 미리보기의 실제 출하품 코드·정역거래 연결을 확인했다.","verdict":"PASS","note":"P1"},{"id":"PC-DELTA-SHIPPING-03","category":"출하","action":"출하 요청의 수정 이력과 준비 영향 표시를 펼치고 접는다.","expected":"각 변경의 전후값·작업자·시각과 준비 취소 또는 유지 영향이 실제 원장과 같아야 합니다.","actual":"출하 변경 이력에는 변경 전후값, 수정자, 시각, 준비 영향 여부가 보이고 준비 관련 변경은 별도로 표시됩니다.\n\n보완 브라우저 실측: 출하 목록의 요청·준비·픽업 상태를 열고 편집 2·3·4·5단계의 기준품·실제 출하품·연결 PA·BOM 구성·변경 구성품을 대조했다. 준비 확인에서 시리얼 필수와 예약 전용 효과, 준비 취소의 해제 목록, 픽업과 픽업 취소 미리보기의 실제 출하품 코드·정역거래 연결을 확인했다.","verdict":"PASS","note":"P1"},{"id":"PC-DELTA-SHIPPING-04","category":"출하·권한","action":"출하 전담 역할이 없는 일반 부서 직원으로 출하 요청 생성, 준비 완료, 픽업 완료를 차례로 실행한다.","expected":"회사가 출하 처리를 맡긴 직원만 준비 완료와 픽업 완료를 눌러 실제 PF 재고를 줄일 수 있어야 한다. 모든 활성 직원에게 허용하는 업무라면 그 정책이 관리자 설정이나 화면 안내에 분명히 보여야 하며, 단순히 출하 메뉴가 보인다는 이유만으로 중요한 재고 처리가 가능해서는 안 된다.","actual":"출하 부서 직원이나 별도 출하 담당자로 지정하지 않은 고압 부서 일반 직원으로 출하 요청을 만들고, 준비 완료와 픽업 완료까지 모두 처리할 수 있었다. 별도의 권한 확인이나 PIN 입력은 없었고 PF 재고가 실제로 3개에서 2개로 줄었다. 현재 프로그램과 자동 테스트도 부서나 출하 역할이 아니라 직원이 존재하고 활성 상태인지만 확인하도록 되어 있다.","verdict":"DIFFERENCE","note":"P1 · 현재 구현과 테스트가 허용하는 동작이지만 회사의 출하 권한 정책이 화면과 데이터 모델에 정의돼 있지 않다. 활성 직원 누구나 허용이 확정되면 PASS로 바꾸고, 출하 담당자만 허용이면 P0 권한 결함으로 올린다."},{"id":"PC-DELTA-SHIPPING-05","category":"출하·권한","action":"로그인 직원과 다른 요청자 이름을 넣어 신규 출하 요청 API를 직접 호출한다.","expected":"출하 요청을 저장할 때 요청자 이름은 현재 로그인한 직원으로 서버가 직접 정해야 한다. 화면이나 외부 프로그램이 다른 이름을 보내더라도 그 이름을 그대로 저장하면 안 되며, 로그인 직원 이름으로 고치거나 요청을 거부해야 한다.","actual":"고압 직원으로 로그인한 상태를 가정하고 요청자 이름을 `QA-SPOOFED-REQUESTER-151013`으로 바꾼 출하 요청을 서버에 직접 보냈다. 서버는 로그인 직원을 확인하지 않고 보낸 이름을 그대로 요청자로 저장했다. 준비 중 요청을 즉시 공식 취소했고 재고와 출하 차감 내역은 바뀌지 않았지만, 요청자 기록을 다른 사람 이름으로 남길 수 있다는 점은 확인됐다.\n\n보완 브라우저 실측: 출하 목록의 요청·준비·픽업 상태를 열고 편집 2·3·4·5단계의 기준품·실제 출하품·연결 PA·BOM 구성·변경 구성품을 대조했다. 준비 확인에서 시리얼 필수와 예약 전용 효과, 준비 취소의 해제 목록, 픽업과 픽업 취소 미리보기의 실제 출하품 코드·정역거래 연결을 확인했다.","verdict":"DIFFERENCE","note":"P0 · 요청자 감사 기록을 클라이언트가 위조할 수 있다. 서버가 현재 작업자를 확인해 요청자를 고정해야 한다."},{"id":"PC-DELTA-SHIPPING-06","category":"출하·재시도 안전","action":"같은 신규 출하 요청을 네트워크 재전송이나 외부 API 재시도로 두 번 보낸다.","expected":"출하 요청 버튼을 눌렀을 때 응답이 늦어 브라우저나 통신 장비가 같은 요청을 다시 보내더라도 출하 요청은 한 건만 만들어져야 한다. 직원이 목록에서 똑같은 요청 두 건을 취소하거나 구분해야 해서는 안 된다.","actual":"화면에서 버튼을 빠르게 두 번 누르는 경우에는 한 번만 보내도록 막혀 있다. 그러나 서버의 신규 출하 요청 주소에는 같
