name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "refactor/**", "codex/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification-runtime:
    name: Verification policy (Windows PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Verify smart policy and PowerShell orchestration
        run: python -m pytest backend/tests/ops/test_verification_policy.py backend/tests/ops/test_verify_local_runtime.py backend/tests/ops/test_verify_local_parallel_contract.py backend/tests/ops/test_verify_e2e_runtime.py backend/tests/ops/test_ic20_verification_contract.py --confcutdir=backend/tests/ops -q

  backend:
    name: Backend (pytest + compile + openapi-drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Ruff baseline
        working-directory: backend
        run: python -m ruff check .

      - name: mypy baseline
        working-directory: backend
        run: python -m mypy

      - name: Compile check
        run: python -m compileall backend

      - name: Run pytest
        working-directory: backend
        run: pytest -q

      - name: OpenAPI drift check
        working-directory: backend
        run: |
          python -c "
          import sys, json
          sys.path.insert(0, '.')
          from app.main import app
          with open('/tmp/openapi-current.json', 'w', encoding='utf-8') as f:
              json.dump(app.openapi(), f, indent=2, sort_keys=True, ensure_ascii=False)
              f.write('\n')
          "
          diff -u ../_dev/baselines/openapi.json /tmp/openapi-current.json \
            && echo "[OK] OpenAPI spec matches baseline." \
            || (echo "" && echo "[FAIL] OpenAPI drift detected." \
                && echo "If this schema change is intentional, refresh the baseline and commit it:" \
                && echo "  cd backend && python -c \"from app.main import app; import json; open('../_dev/baselines/openapi.json','w',encoding='utf-8').write(json.dumps(app.openapi(),indent=2,sort_keys=True,ensure_ascii=False)+chr(10))\"" \
                && exit 1)

  windows-ops-profile:
    name: Windows ops profile contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ops test dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run ops profile contract tests
        working-directory: backend
        run: pytest tests/ops/test_runtime_paths.py -q -k "profile_resolver_test_root or ops_batches_treat_a_fake_http_503_as_failure_before_success_flow"

  postgres-concurrency:
    name: PostgreSQL concurrency (Alembic head · two connections)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mes_test
          POSTGRES_PASSWORD: mes_test
          POSTGRES_DB: mes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mes_test -d mes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://mes_test:mes_test@127.0.0.1:5432/mes_test
      TEST_POSTGRES_URL: postgresql://mes_test:mes_test@127.0.0.1:5432/mes_test
      DEXCOWIN_POSTGRES_TEST_ACK: ALLOW_TEST_DB_MUTATION
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Bootstrap PostgreSQL schema to Alembic head
        working-directory: backend
        run: |
          python bootstrap_db.py --all
          python bootstrap_db.py --check

      - name: Run real two-connection locking tests
        working-directory: backend
        run: python scripts/verify_postgres_concurrency.py

  frontend:
    name: Frontend (lint + tsc + vitest+coverage + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache .next/cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.[jt]s', 'frontend/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint:strict

      - name: Type check
        working-directory: frontend
        run: npm run typecheck:app

      - name: Unit test type check
        working-directory: frontend
        run: npm run typecheck:tests

      - name: E2E type check
        working-directory: frontend
        run: npm run typecheck:e2e

      - name: Vitest (with coverage gate)
        working-directory: frontend
        run: npm run test:coverage:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

      - name: Build (Next.js production)
        working-directory: frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Bundle size gate
        working-directory: frontend
        run: npm run check:bundle-size

  e2e:
    name: E2E (Playwright · 전용 DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # globalSetup 이 전용 mes_e2e.db 부트스트랩·시드·백엔드(8021) 기동, webServer 가 next dev(3100).
      # 실 backend/mes.db 는 CI 체크아웃에 없음(.gitignore) → 해시 가드 자동 생략.
      - name: Playwright E2E
        working-directory: frontend
        run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
