version: "3.9"

services:
  backend:
    build: ../backend
    container_name: mes_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////app/mes.db
      MES_RUNTIME_ROOT: /runtime
      # frontend와 같은 shell-provided 32-byte 이상 비밀. 저장소에 실제 값 기록 금지.
      MES_PROXY_SHARED_SECRET: ${MES_PROXY_SHARED_SECRET:?MES_PROXY_SHARED_SECRET must be set}
    ports:
      - "8010:8010"
    volumes:
      - ../backend/mes.db:/app/mes.db
      - ../_attic/runtime:/runtime
    # backend.command 제거 — backend/Dockerfile CMD 와 동일 (8010, no --reload).

  frontend:
    build: ../frontend
    container_name: mes_frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8010
      # backend와 같은 값으로 custom Next server assertion을 서명한다.
      MES_PROXY_SHARED_SECRET: ${MES_PROXY_SHARED_SECRET:?MES_PROXY_SHARED_SECRET must be set}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    # frontend.command — npm run start 만. 빌드는 frontend/Dockerfile RUN npm run build 에서 완료.
    command: npm run start
